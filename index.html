 {id:"pass",p:"g",ic:"be",name:"Пассивный залог",rule:"Present Simple Passive: S + am/is/are + V3/Ved\nPast Simple Passive: S + was/were + V3/Ved\nPresent Perfect Passive: S + have/has been + V3/Ved\nПодсказка: действие совершают над подлежащим (часто есть by …)"},
 {id:"futsimple",p:"g",ic:"will",name:"Future Simple",rule:"Утвердительное предложение в Future Simple: S + will + V1\nОтрицательное предложение в Future Simple: S + will not + V1\nМаркеры: tomorrow, next week, soon, in the future, I think, I promise"},
 {id:"reported",p:"g",ic:"would",name:"Косвенная речь",rule:"Будущее в прошедшем (после said, told, thought, knew, promised): S + would + V1\nОтрицательное предложение: S + would not + V1\nПример: He said, “I will come.” → He said that he would come."},
 {id:"cond",p:"g",ic:"if",name:"Условные и I wish",rule:"Реальное условие (1 тип): If Present Simple, Future Simple\nНереальное условие (2 тип): If Past Simple, would V1\nСожаление о настоящем: wish + Past Simple (V2/Ved)"},
 {id:"modal",p:"g",ic:"can",name:"Модальные: can, must",rule:"can в прошедшем времени: S + could + V1\nОтрицательное предложение: S + could not / cannot + V1\nЗапрет: S + must not + V1"},
 {id:"comp",p:"g",ic:"-er",name:"Степени сравнения",rule:"Сравнительная степень:\nЕсли в слове 1–2 слога, добавляем окончание -er (tall – taller)\nЕсли в слове более 2 слогов, добавляем more (beautiful – more beautiful)\nПодсказка на сравнительную степень: than (чем)\nПревосходная степень:\nЕсли в слове 1–2 слога, добавляем артикль the и окончание -est (tall – the tallest)\nЕсли в слове более 2 слогов, добавляем к слову the most (beautiful – the most beautiful)\nПодсказка на превосходную степень: the … ever, in the world\nИсключения: good – better – the best, bad – worse – the worst, far – farther – the farthest, little – less – the least, many / much – more – the most"},
 {id:"pron",p:"g",ic:"me",name:"Местоимения",rule:"Объектная форма (кем? кому? кого?): me, him, her, it, us, you, them\nПритяжательный падеж (чей? чья? чьё?): my, his, her, its, our, your, their"},
 {id:"pl",p:"g",ic:"-s",name:"Множественное число",rule:"Множественное число образуется путём добавления окончания -s / -es (box – boxes, story – stories)\nИсключения: man – men, woman – women, child – children, foot – feet, tooth – teeth, mouse – mice, leaf – leaves"},
 {id:"num",p:"g",ic:"1st",name:"Порядковые числительные",rule:"Порядковое числительное:\nК количественному числительному добавляется окончание -th (five – fifth, twelve – twelfth)\nИсключения: one – first, two – second, three – third\nУ количественных числительных -ty меняется на -tieth: twenty – twentieth, forty – fortieth"},
 {id:"wn",p:"w",ic:"N",name:"Существительные",rule:"Существительное от глагола: V + -tion/-sion/-ment/-ance (decide – decision)\nСуществительное от прилагательного: adj + -ness/-ity (kind – kindness)\nЧеловек: V/N + -er/-or/-ist (teach – teacher, science – scientist)\nСтоит после a/an/the, предлога, my/his или прилагательного"},

const T=Object.fromEntries(TOPICS.map(t=>[t.id,t]));
const fmt=txt=>esc(txt).split("\n").map(l=>/:$/.test(l)?`<b>${l}</b>`:l).join("<br>");
const rule=t=>fmt(t.rule);
const ruleG=(g,reveal=true)=>fmt(g.r||beExplain(g)||(T[g.t].p==="w"?wfExplain(g,reveal):T[g.t].rule));
/* to be needs its own explanation: which form (was/were, is/are) and the there + to be construction */
DATA.texts.forEach(t=>t.g.forEach((g,i)=>{if(/^(NOT[ /])?BE$/.test(g.w)&&/there\s*$/i.test(t.s[i]))g.th=1}));
function beExplain(g){
  if(!/^(NOT[ /])?BE$/.test(g.w)||(g.t!=="past"&&g.t!=="pres"))return "";
  const past=g.t==="past";
  const forms=past?"Глагол to be в Past Simple:\nI/he/she/it + was\nyou/we/they + were\nОтрицание: was not / were not"
    :"Глагол to be в Present Simple:\nI + am\nhe/she/it + is\nyou/we/they + are\nОтрицание: am not / is not / are not";
  const there=past?"Конструкция there + to be (есть, находится):\nthere was + существительное в единственном числе (there was nobody, there was a book)\nthere were + существительное во множественном числе (there were many people)"
    :"Конструкция there + to be (есть, находится):\nthere is + существительное в единственном числе (there is a park)\nthere are + существительное во множественном числе (there are many parks)";
  const when=past?"Маркеры Past Simple: yesterday, last week, ago, in 2010, рассказ о прошлом":"Маркеры Present Simple: usually, often, always, every day, факт о настоящем";
  return (g.th?there+"\n"+forms:forms)+"\n"+when}
function wfExplain(g,reveal){
  const w=g.w.toLowerCase(),a=g.a[0].toLowerCase(),pair=reveal?`: ${w} → ${a}`:"";
  if(g.t==="wn"){const person=/(er|or|ist|ian)$/.test(a);
    return `По смыслу требуется существительное${person?" (профессия, человек)":""}${pair}\nПодсказка на существительное:\nстоит после артиклей a/an/the, предлогов, my/his или прилагательных`}
  if(g.t==="wa")return `По смыслу требуется прилагательное${pair}\nПодсказка на прилагательное:\nстоит перед существительным или после глаголов be, feel, look, seem, become`;
  if(g.t==="wadv")return `По смыслу требуется наречие${pair}\nПодсказка на наречие:\nотвечает на вопрос «как?» и относится к глаголу или прилагательному; может стоять в начале предложения (Luckily, …)`;
  if(/^inter/.test(a)&&!/^inter/.test(w))return `По смыслу требуется прилагательное «международный»${pair}\nПодсказка на приставку inter-:\ninter- означает «между»: national (национальный) → international (международный)`;
  const pos=/ly$/.test(a)?"наречие":["disagree","dislike","disapprove","disappear"].includes(a)?"глагол":/(ness|ity|ment|tion)$/.test(a)?"существительное":"прилагательное";
  return `По смыслу требуется ${pos} с противоположным значением${pair}\nПодсказка на отрицательную приставку:\nсмысл предложения противоположен слову-подсказке; un-, dis-, in-, im- (перед p, m), il- (перед l), ir- (перед r)`;
}

const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const norm=s=>String(s||"").toLowerCase().replace(/[’‘`]/g,"'").replace(/won't/g,"will not").replace(/can't/g,"cannot").replace(/can not/g,"cannot").replace(/n't/g," not").replace(/[^a-z0-9' -]/g,"").replace(/\s+/g," ").trim();
const tight=s=>norm(String(s||"").replace(/\b(did|do|does|was|were|is|are|has|have|had|could|would|must|should)nt\b/gi,"$1 not").replace(/\bwont\b/gi,"will not").replace(/\bcant\b/gi,"cannot")).replace(/[\s'-]/g,"");
const squash=s=>String(s||"").toLowerCase().replace(/[’‘`]/g,"'").replace(/[^a-z0-9]/g,"");
const contracted=a=>norm(a).replace(/\bwill not\b/g,"wont").replace(/\bcannot\b/g,"cant").replace(/\b(\w+) not\b/g,"$1nt");
const isRight=(gap,v)=>gap.a.some(a=>tight(a)===tight(v)||squash(contracted(a))===squash(v));
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const pick=a=>a[Math.floor(Math.random()*a.length)];
const gapsOf=topic=>{const out=[];DATA.texts.forEach(t=>t.g.forEach((g,i)=>{if(g.t===topic)out.push({text:t,i})}));return out};
const lessonFor=t=>(DATA.lessons||[]).find(l=>l.topic===t);
function lessonLink(topic){const l=lessonFor(topic);return l?`<a class="lesson-inline" href="${esc(l.url)}" target="_blank" rel="noopener">Видеоурок: ${esc(l.title)}</a>`:""}

const MOODS={happy:["happy"],ok:["happy","point"],wow:["wow"],oops:["shrug","worry","skeptic"],think:["think"],hint:["point"],upset:["upset"],worry:["worry","bored"]};
function alina(mood="happy",cls="ava"){const k=pick(MOODS[mood]||MOODS.happy);return `<img class="${cls}" src="${ART[k]}" alt="Алина" width="220" height="220">`}
function say(text,mood="happy",small){return `<div class="alina">${alina(mood,small?"ava sm":"ava")}<div class="bubble"><span class="who">Алина</span>${text}</div></div>`}

/* ---------- game state (kept on the student's device) ---------- */
/* readiness for the exam: accuracy per topic (last 20 answers), weighted by how often the topic appears in the FIPI bank; fewer than 10 answers count proportionally less */
const STAGES=[[0,"В начале пути"],[40,"Разбираюсь в темах"],[70,"Почти готов к ОГЭ"],[85,"Готов к ОГЭ"]];
const WEIGHT=(()=>{const c={};DATA.texts.filter(t=>!t.x).forEach(t=>t.g.forEach(g=>{c[g.t]=(c[g.t]||0)+1}));const tot=Object.values(c).reduce((a,b)=>a+b,0)||1;const w={};TOPICS.forEach(t=>{w[t.id]=(c[t.id]||0)/tot});return w})();
const ACH=[
 {id:"first",name:"Первый шаг",d:"Первый верный ответ"},
 {id:"combo5",name:"Серия ×5",d:"5 верных ответов подряд"},
 {id:"combo10",name:"Серия ×10",d:"10 верных ответов подряд"},
 {id:"perfect",name:"Без единой ошибки",d:"Текст из банка без ошибок"},
 {id:"full15",name:"15 из 15",d:"Полный блок 20–34 на максимум"},
 {id:"streak3",name:"Три дня подряд",d:"Занимайся 3 дня без перерыва"},
 {id:"streak7",name:"Неделя огня",d:"7 дней подряд"},
 {id:"hundred",name:"Сотня",d:"100 верных ответов"},
 {id:"words50",name:"Словодел",d:"50 верных в словообразовании"},
 {id:"stars",name:"Звёздный путь",d:"Хотя бы одна звезда в каждой теме"},
 {id:"texts10",name:"Книжный червь",d:"Реши 10 разных текстов"},
 {id:"ready70",name:"Почти готов к ОГЭ",d:"Готовность к ОГЭ 70%"},
 {id:"ready85",name:"Готов к ОГЭ",d:"Готовность к ОГЭ 85%"},
 {id:"words100",name:"Словарный запас",d:"Выучи 100 слов в разделе «Лексика»"},
 {id:"deckdone",name:"Тема изучена",d:"Отметь «знаю» все слова одной темы"}
];
const KEY="oge-game-v1";
function load(){let g={};try{g=JSON.parse(localStorage.getItem(KEY)||"{}")}catch(e){}
  return Object.assign(load.defaults(),g)}
load.defaults=()=>({streak:0,last:"",combo:0,bestCombo:0,correct:0,words:0,stageMax:0,topics:{},best:{},full:[],ach:{},lex:{},lexBest:{}});
let G=load();
function persist(){try{localStorage.setItem(KEY,JSON.stringify(G))}catch(e){}}
const today=()=>{const d=new Date();return d.getFullYear()+"-"+(d.getMonth()+1)+"-"+d.getDate()};
const yesterday=()=>{const d=new Date(Date.now()-864e5);return d.getFullYear()+"-"+(d.getMonth()+1)+"-"+d.getDate()};
function topicScore(id){const r=(G.topics[id]||{}).r||[];if(!r.length)return 0;return (r.reduce((a,b)=>a+b,0)/r.length)*Math.min(1,r.length/10)}
function readiness(){return Math.round(100*TOPICS.reduce((s,t)=>s+WEIGHT[t.id]*topicScore(t.id),0))}
function stageOf(p){let i=0;STAGES.forEach((x,k)=>{if(p>=x[0])i=k});const next=STAGES[i+1];return{i,name:STAGES[i][1],next:next?{at:next[0],name:next[1]}:null}}
function bestGain(){return TOPICS.map(t=>({t,g:Math.round(100*WEIGHT[t.id]*(1-topicScore(t.id)))})).sort((a,b)=>b.g-a.g)[0]}
function starsOf(topic){const r=(G.topics[topic]||{}).r||[];if(r.length<5)return 0;const acc=r.reduce((a,b)=>a+b,0)/r.length;return acc>=.95?3:acc>=.8?2:acc>=.6?1:0}
const liveStreak=()=>G.last===today()||G.last===yesterday()?G.streak:0;
let pending=[];
function unlock(id){if(!G.ach[id]){G.ach[id]=today();const a=ACH.find(x=>x.id===id);pending.push({t:"Новое достижение: "+a.name,s:a.d,mood:"wow"})}}
/* record one answer; returns the rewards */
function record(topic,ok,isWord,noTopic){
  const before=readiness();
  if(G.last!==today()){G.streak=G.last===yesterday()?G.streak+1:1;G.last=today();if(G.streak>=2)setTimeout(()=>showFlame(G.streak,"lit"),900)}
  /* multiple-choice answers (noTopic) keep the series and day streak but do not change topic accuracy or readiness */
  const t=noTopic?{ok:0,n:0,r:[]}:(G.topics[topic]=G.topics[topic]||{ok:0,n:0,r:[]});t.n++;t.r.push(ok?1:0);if(t.r.length>20)t.r.shift();
  if(ok){t.ok++;G.correct++;if(isWord)G.words++;G.combo++;G.bestCombo=Math.max(G.bestCombo,G.combo)}
  else G.combo=0;
  if(G.correct>=1)unlock("first");if(G.combo>=5)unlock("combo5");if(G.combo>=10)unlock("combo10");
  if(G.correct>=100)unlock("hundred");if(G.words>=50)unlock("words50");
  if(G.streak>=3)unlock("streak3");if(G.streak>=7)unlock("streak7");
  if(TOPICS.every(x=>starsOf(x.id)>=1))unlock("stars");
  const after=readiness(),si=stageOf(after).i;if(si>(G.stageMax||0)){G.stageMax=si;pending.push({t:"Новый этап: «"+stageOf(after).name+"»",s:"Готовность к ОГЭ: "+after+"%. Так держать!",mood:"wow"})}
  if(after>=70)unlock("ready70");if(after>=85)unlock("ready85");
  persist();return{combo:G.combo};
}
function toastNext(){
  if(!pending.length)return;const p=pending.shift();
  let el=document.getElementById("toast");if(!el){el=document.createElement("div");el.id="toast";el.className="toast";el.setAttribute("role","status");document.body.appendChild(el)}
  el.innerHTML=alina(p.mood,"ava")+`<div><b>${esc(p.t)}</b><span>${esc(p.s)}</span></div>`;
  el.classList.add("on");setTimeout(()=>{el.classList.remove("on");setTimeout(toastNext,350)},2600);
}
function readyHTML(a,b){const d=b-a;return `<span class="gain"><span>${IC.target}Готовность ${b}%${d>0?` (+${d}%)`:d<0?` (${d}%)`:""}</span></span>`}

/* sentence around one gap; other gaps shown filled with the key */
function context(text,i){
  let full="",pos=[];
  text.s.forEach((seg,k)=>{full+=seg;if(k<text.g.length){pos.push(full.length);full+="\u0000"+k+"\u0000"}});
  const at=pos[i];const ABBR=/\b(Mr|Mrs|Ms|Dr|St)$/;
  /* a sentence ends at . ! ? … (plus a closing quote) only when the next word starts a new sentence:
     “Why?” he asked — stays one sentence */
  const cuts=[0];const re=/[.!?…]["”’]?\s+(?=[A-Z0-9“"‘(\u0000])/g;let m;
  while((m=re.exec(full))){if(!ABBR.test(full.slice(0,m.index)))cuts.push(m.index+m[0].length)}
  cuts.push(full.length);
  let k=0;while(k<cuts.length-2&&cuts[k+1]<=at)k++;
  let start=cuts[k],end=cuts[k+1];
  /* keep it to the gap's own sentence; widen only when that alone is unclear:
     a very short sentence gets the next one; a reply in dialogue (smiled: “…) or a still-short piece gets the one before */
  const len=x=>x.replace(/\u0000\d+\u0000/g,"___").trim().length;const own=full.slice(start,end);
  if(len(own)<45&&k+2<cuts.length)end=cuts[k+2];
  if(k>0){const prev=full.slice(cuts[k-1],start);
    if(len(full.slice(start,end))<50||len(prev)<15||/:\s*[“"]/.test(own))start=cuts[k-1]}
  const G=text.g[i];
  if(G.cx)return full.slice(cuts[Math.max(0,k-G.cx[0])],cuts[Math.min(cuts.length-1,k+1+G.cx[1])]).trim();
  if(G.cb)start=Math.min(start,cuts[Math.max(0,k-G.cb)]);
  if(G.ca)end=Math.max(end,cuts[Math.min(cuts.length-1,k+1+G.ca)]);
  return full.slice(start,end).trim();
}
function renderCtx(str,i,text,filled){
  return esc(str).replace(/\u0000(\d+)\u0000/g,(_,k)=>{k=+k;if(k===i)return filled!=null?`<span class="blank">${esc(filled)}</span>`:`<span class="blank">&nbsp;</span>`;return `<span class="other">${esc(text.g[k].a[0])}</span>`});
}

  const B=shuffle(gapsOf(m.b)).slice(0,7),A=shuffle(gapsOf(m.a)).slice(0,15-B.length);return shuffle(A.concat(B))}
function startTrain(topic){session={topic,mix:!!MIXT[topic],quiz:!!(MIXT[topic]&&MIXT[topic].quiz),queue:trainQueue(topic),i:0,maxI:0,hist:[],ok:0,answered:false,hint:false,r0:readiness()};setView("train")}
/* show question i of the current training: answered ones come back as a read-only review */
function trainStep(i){const s=session;s.i=i;const h=s.hist[i];s.answered=!!h;s.last=h||null;s.hint=false;s.answeredAt=0;setView("train");const n=app().querySelector("#ans");if(n&&!h)n.focus()}
/* one multiple-choice task: tap an answer; the hint removes two wrong answers */
function renderQuiz(s,t,it,gap){
  const ctx=renderCtx(context(it.text,it.i),it.i,it.text,s.answered?s.last.v:null);
  const cut=s.hint?(s.cut||(s.cut=shuffle(it.ord.filter(o=>o!==gap.a[0])).slice(0,2))):[];
  let fb="";
  if(s.answered){const ok=s.last.ok;fb=`<div class="alina pop">${alina(ok?"ok":"oops","ava sm")}<div class="fb ${ok?"ok":"bad"}" role="status" style="flex:1;min-width:0"><span class="verdict">${ok?pick(LINES.ok):pick(LINES.bad)}</span>${ok?"":`<span>Правильный ответ: <span class="ans">${esc(gap.a[0])}</span></span>`}<span><b>Здесь нужен ${esc(T[gap.t].name)}:</b> ${esc(gap.why)}</span><span class="rule">${ruleG(gap)}</span>${ok?"":lessonLink(gap.t)}</div></div>`}
  else if(s.hint)fb=say("<b>Подсказка.</b><br>Я убрала два неверных варианта. Посмотри, какие слова в предложении подсказывают время.","hint",true);
  const opts=it.ord.map((o,n)=>{const st=s.answered?(o===gap.a[0]?"ok":o===s.last.v?"bad":"gone"):cut.includes(o)?"gone":"";
    return `<button class="opt ${st}" data-o="${esc(o)}" ${s.answered||cut.includes(o)?"disabled":""}><span class="k">${n+1}</span>${esc(o)}</button>`}).join("");
  app().innerHTML=`<section class="card sheet">
    <div class="sheet-head"><div><div class="eyebrow">Разница времён · ${s.i+1} из ${s.queue.length}</div><h2>${esc(t.name)}</h2></div>
      <div class="hud">${G.combo>=2?`<span class="combo">Серия ×${G.combo}</span>`:""}</div></div>
    <div class="progress"><u style="width:${100*s.i/s.queue.length}%"></u></div>
    <p class="ctx">${ctx}</p>
    <div class="opts">${opts}</div>
    ${fb}
    <div class="row">${s.answered?`<button class="btn" id="next">${s.i+1<s.queue.length?"Дальше":"Итог"}</button>`:s.hint?"":`<button class="btn ghost" id="hintb">Подсказка Алины</button>`}</div></section>`;
  const choose=v=>{if(s.answered)return;const ok=v===gap.a[0];const r=record(gap.t,ok,false,true);if(ok)s.ok++;s.answered=true;s.answeredAt=Date.now();s.last={v,ok,r};s.hist[s.i]=s.last;s.cut=null;drawBar();render();setTimeout(()=>{const n=app().querySelector("#next");if(n)n.focus()},450);toastNext()};
  app().querySelectorAll(".opt:not(:disabled)").forEach(b=>b.onclick=()=>choose(b.dataset.o));
  const nx=app().querySelector("#next");if(nx)nx.onclick=()=>{if(Date.now()-(s.answeredAt||0)<450)return;const i=s.i+1;s.maxI=Math.max(s.maxI,i);s.cut=null;trainStep(i)};
  const h=app().querySelector("#hintb");if(h)h.onclick=()=>{s.hint=true;render()};
  document.onkeydown=e=>{if(view!=="train"||!session||!session.quiz||s.answered)return;const n=+e.key;if(n>=1&&n<=4){const o=it.ord[n-1];if(!cut.includes(o))choose(o)}};
}
function renderTrain(){
  const s=session,t=TT(s.topic);const lessonId=s.mix?t.b:s.topic;

      <div class="row"><button class="btn" id="again">Ещё раз</button><button class="btn ghost" id="home">К темам</button></div></section>`;
    app().querySelector("#again").onclick=()=>startTrain(s.topic);app().querySelector("#home").onclick=()=>setView("home");toastNext();return;
  }
  const it=s.queue[s.i],gap=it.text.g[it.i];
  if(gap.o)return renderQuiz(s,t,it,gap);
  const ctx=renderCtx(context(it.text,it.i),it.i,it.text,s.answered?s.last.v:null);
  let fb="";
  if(s.answered){const ok=s.last.ok;fb=`<div class="alina pop">${alina(ok?"ok":"oops","ava sm")}<div class="fb ${ok?"ok":"bad"}" role="status" style="flex:1;min-width:0"><span class="verdict">${ok?pick(LINES.ok):pick(LINES.bad)}</span>${ok?"":`<span>Правильный ответ: <span class="ans">${esc(gap.a.join(" / "))}</span></span>`}${s.mix?`<span><b>Здесь нужен ${esc(T[gap.t].name)}</b></span><span class="rule">${mixRule(t,gap)}</span>`:`<span class="rule">${ruleG(gap)}</span>`}${ok?"":lessonLink(s.mix?lessonId:gap.t)}</div></div>`}
  else if(s.hint){fb=say(`<b>Подсказка.</b><br>${s.mix?mixRule(t,gap):ruleG(gap,false)}<br>Ответ начинается на <span class="ans">${esc(gap.a[0].slice(0,1))}</span> и состоит из ${gap.a[0].split(" ").length===1?"одного слова":gap.a[0].split(" ").length+" слов"}.`,"hint",true)}
  app().innerHTML=`<section class="card sheet">
    <div class="sheet-head"><div><div class="eyebrow">${s.mix?"Разница времён":"Тренировка темы"} · ${s.i+1} из ${s.queue.length}</div><h2>${esc(t.name)}</h2></div>
      <div class="hud">${G.combo>=2?`<span class="combo">Серия ×${G.combo}</span>`:""}</div></div>
    <div class="progress"><u style="width:${100*s.i/s.queue.length}%"></u></div>
    <p class="hint">Преобразуй слово так, чтобы оно подходило по смыслу и грамматике.</p>
    <p class="ctx">${ctx}</p>
    <div class="answer-row"><input class="cell${s.answered?(s.last.ok?" ok":" bad"):""}" id="ans" autocomplete="off" autocapitalize="characters" spellcheck="false" aria-label="Ответ, слово ${esc(gap.w)}" value="${s.answered?esc(s.last.v):""}" ${s.answered?"readonly":""}><span class="word">${esc(gap.w)}</span></div>
    ${fb}
    <div class="row">${s.answered?`<button class="btn" id="next">${s.i+1<s.queue.length?"Дальше":"Итог"}</button>`:`<button class="btn" id="check">Проверить</button>${s.hint?"":`<button class="btn ghost" id="hintb">Подсказка Алины</button>`}`}</div></section>`;
  const inp=app().querySelector("#ans");
  const check=()=>{const v=inp.value.trim();if(!v){inp.focus();return}const ok=isRight(gap,v);const r=record(gap.t,ok,T[gap.t].p==="w");if(ok)s.ok++;s.answered=true;s.answeredAt=Date.now();s.last={v,ok,r};s.hist[s.i]=s.last;drawBar();render();setTimeout(()=>{const n=app().querySelector("#next");if(n)n.focus()},450);toastNext()};
  if(s.answered)app().querySelector("#next").onclick=()=>{if(Date.now()-(s.answeredAt||0)<450)return;const i=s.i+1;s.maxI=Math.max(s.maxI,i);trainStep(i)};
  else{app().querySelector("#check").onclick=check;inp.addEventListener("keydown",e=>{if(e.key==="Enter"){e.preventDefault();check()}});setTimeout(()=>inp.focus(),0);
    const h=app().querySelector("#hintb");if(h)h.onclick=()=>{s.hint=true;const v=inp.value;render();const n=app().querySelector("#ans");n.value=v;n.focus()}}
}

/* ---------- whole texts (exam-like) ---------- */
const bankTexts=k=>DATA.texts.filter(t=>t.k===k&&!t.x);
const pickText=k=>shuffle(bankTexts(k))[0];
function startRandom(kind){const texts=kind==="full"?[pickText("g"),pickText("w")]:[pickText(kind)];startTest(texts,kind)}
function startTest(texts,kind){session={kind,blocks:texts.map(t=>({text:t,start:t.k==="g"?20:29,v:t.g.map(()=>"")})),checked:false};setView("test")}
function renderTest(){
  const s=session;const total=s.blocks.reduce((n,b)=>n+b.text.g.length,0);

    const mood=ok===total?"wow":ok>=total*.7?"happy":"worry";

      <p class="hint">${isG?"Преобразуй слова, напечатанные заглавными буквами, так, чтобы они грамматически соответствовали содержанию текста.":"Образуй от слов, напечатанных заглавными буквами, однокоренные слова, которые грамматически и лексически соответствуют содержанию текста."}</p>
      <p class="kim">${html}</p>${key}</div>`}).join("");
  app().innerHTML=`<section class="card sheet"><div class="sheet-head"><div><div class="eyebrow">${s.kind==="one"?"Текст из банка":"Случайный вариант"}</div><h2>${s.blocks.length>1?"Задания 20–34":s.blocks[0].text.k==="g"?"Задания 20–28":"Задания 29–34"}</h2></div><span class="tid">1 балл за пропуск</span></div>
    ${head}${blocks}
    <div class="row">${s.checked?`<button class="btn" id="new">${s.kind==="one"?"Решить заново":"Новый вариант"}</button><button class="btn ghost" id="home">${s.kind==="one"?"К банку текстов":"К темам"}</button>`:`<button class="btn" id="check">Проверить</button>`}</div></section>`;

/* ---------- progress ---------- */
function medal(i,on){const hues=["var(--violet)","var(--sun)","var(--coral)","var(--green)"];const c=hues[i%4];
  return `<svg class="medal" viewBox="0 0 48 48" aria-hidden="true"><path d="M16 4h7l-3 14h-7zM32 4h-7l3 14h7z" fill="${on?c:"var(--line)"}" opacity=".7"/><circle cx="24" cy="30" r="14" fill="${on?c:"var(--line)"}"/><path d="M24 22l2.5 5 5.5.8-4 3.9.9 5.5-4.9-2.6-4.9 2.6.9-5.5-4-3.9 5.5-.8z" fill="#fff" opacity="${on?1:.6}"/></svg>`}
function topicState(id){const r=G.topics[id];if(!r||!r.n)return{cls:"none",label:"Не начата",acc:null,n:0,rec:[]};
  const rec=r.r||[];const acc=rec.length?Math.round(100*rec.reduce((a,b)=>a+b,0)/rec.length):0;
  if(rec.length<5)return{cls:"none",label:"Мало ответов",acc,n:r.n,rec};
  const [cls,label]=acc>=95?["done","Освоена"]:acc>=80?["good","Хорошо"]:acc>=60?["work","Нужна практика"]:["weak","Давай подтянем"];
  return{cls,label,acc,n:r.n,rec}}
function renderProgress(){
  const R=readiness();const got=ACH.filter(a=>G.ach[a.id]).length;

    weakest&&weakest.s.acc<80?`Больше всего ошибок в теме <b>${esc(weakest.t.name)}</b> (${weakest.s.acc}% верных). Давай потренируем её сегодня?`:
    fresh?`Отличные результаты! Попробуй новую тему: <b>${esc(fresh.t.name)}</b>.`:"Все темы идут хорошо. Реши полный вариант, чтобы проверить себя как на экзамене!";
  const row=({t,s})=>{const color=s.cls==="done"?"var(--green)":s.cls==="good"?"var(--sun)":s.cls==="weak"?"var(--red)":"var(--orange)";
    return `<div class="tp"><div class="tp-name"><b>${esc(t.name)}</b><span class="pill ${s.cls}">${s.label}</span>${starsHTML(starsOf(t.id))}</div>
    <button class="btn small ${s.n?"ghost":""}" data-topic="${t.id}">${s.n?"Тренировать":"Начать"}</button>
    <div class="tp-bar">${s.n?`<span class="pbar"><u style="width:${s.acc}%;background:${color}"></u></span><small>${s.acc}% · ${s.n} ответов</small>`:`<small>${gapsOf(t.id).length} заданий ждут тебя</small>`}</div>
    ${s.rec.length?`<div class="dots" aria-label="Последние ответы">${s.rec.map(x=>`<i class="${x?"y":""}"></i>`).join("")}</div>`:""}</div>`};
  app().innerHTML=`<div class="card">${say(tip,weakest&&weakest.s.acc<80?"think":"happy",true)}</div>
  <button class="tgcard" id="tolex" style="border:none;cursor:pointer;text-align:left;width:100%"><span class="tgtext"><b>Лексика: выучено ${knownAll()} из ${totalWords()} слов</b><small>Карточки, тест и подбор пар по 13 темам ОГЭ</small></span><span class="btn small">Учить слова</span></button>
  <div class="sum3"><div class="stat"><b>${total?Math.round(100*okAll/total)+"%":"—"}</b><small>верных ответов</small></div><div class="stat"><b>${total}</b><small>всего ответов</small></div><div class="stat"><b>${mastered}/${TOPICS.length}</b><small>тем освоено</small></div><div class="stat"><b>${R}%</b><small>готовность к ОГЭ</small></div></div>
  <section class="part"><div class="part-head"><h2>Задания 20–28: <span class="acc">грамматика</span></h2></div>
  <p class="hint">Полоска показывает, сколько из твоих последних 20 ответов по теме верные. Кружочки — это сами ответы по порядку: <span class="dots" style="display:inline-flex;vertical-align:middle"><i class="y"></i></span> верно, <span class="dots" style="display:inline-flex;vertical-align:middle"><i></i></span> ошибка.</p>
  <div class="tplist">${st.filter(x=>x.t.p==="g").map(row).join("")}</div></section>
  <section class="part"><h2>Задания 29–34: <span class="acc">словообразование</span></h2><div class="tplist">${st.filter(x=>x.t.p==="w").map(row).join("")}</div></section>
  <section class="part"><details class="more"><summary>Достижения: ${got} из ${ACH.length} ▾</summary><div class="achs small" style="margin-top:12px">${ACH.map((a,i)=>`<div class="ach ${G.ach[a.id]?"":"off"}">${medal(i,!!G.ach[a.id])}<b>${esc(a.name)}</b><small>${esc(a.d)}</small></div>`).join("")}</div></details></section>
  <section class="part"><h2>Перенести прогресс <span class="acc">на другое устройство</span></h2>
  <div class="panel transfer"><p class="hint">Прогресс хранится в этом браузере. Чтобы продолжить на другом телефоне или компьютере, скопируй код здесь и вставь его там.</p>
  <div class="split"><div><label class="field" for="pcode"><b style="font-size:13px">Мой код прогресса</b></label><textarea id="pcode" readonly placeholder="Создаю код…"></textarea><div class="row"><button class="btn small" id="pcopy" disabled>Скопировать код</button></div><span class="msg" id="pmsg1"></span></div>

const LX={d:0,f:-1,unk:false,q:null};
const TRAPS_D=LEX.decks.length;
const deckName=d=>d===TRAPS_D?"Слова-ловушки":LEX.decks[d].n;
const deckCards=d=>d===TRAPS_D?LEX.traps.map(t=>({en:t[0],ru:"",trap:t,s:-1,k:d+":"+t[0]})):LEX.decks[d].c.map(c=>({en:c[0],ru:c[1],s:c[2],k:d+":"+c[0]}));
const lexState=k=>(G.lex||{})[k]||0;
const knownIn=d=>deckCards(d).filter(c=>lexState(c.k)===2).length;
const totalWords=()=>LEX.decks.reduce((n,x)=>n+x.c.length,0);
const knownAll=()=>{let n=0;for(let d=0;d<LEX.decks.length;d++)n+=knownIn(d);return n};
function setLex(k,v){G.lex=G.lex||{};G.lex[k]=v;
  if(G.last!==today()){G.streak=G.last===yesterday()?G.streak+1:1;G.last=today();if(G.streak>=2)setTimeout(()=>showFlame(G.streak,"lit"),900)}
  if(G.streak>=3)unlock("streak3");if(G.streak>=7)unlock("streak7");
  if(knownAll()>=100)unlock("words100");
  const d=+k.split(":")[0];if(d<TRAPS_D&&knownIn(d)===LEX.decks[d].c.length)unlock("deckdone");
  persist()}
function pool(d){let c=deckCards(d);if(LX.f>=0)c=c.filter(x=>x.s===LX.f);if(LX.unk)c=c.filter(x=>lexState(x.k)!==2);return c}
const canSpeak=(()=>{try{return "speechSynthesis" in window&&typeof SpeechSynthesisUtterance==="function"}catch(e){return false}})();
function speak(text){if(!canSpeak)return;try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text.replace(/\//g,","));u.lang="en-GB";u.rate=.9;speechSynthesis.speak(u)}catch(e){}}
const spkBtn=t=>canSpeak?`<button class="spk" data-say="${esc(t)}" aria-label="Послушать произношение">${IC.spk}</button>`:"";
function wireSpeak(){app().querySelectorAll("[data-say]").forEach(b=>b.onclick=e=>{e.stopPropagation();speak(b.dataset.say)})}

/* topics list */
function renderLexicon(){
  const all=totalWords(),kn=knownAll();
  const tile=d=>{const n=d===TRAPS_D?LEX.traps.length:LEX.decks[d].c.length,k=knownIn(d),p=Math.round(100*k/n);
    return `<button class="deck" data-deck="${d}"><span class="tn"><b>${esc(deckName(d))}</b><small>${n} ${d===TRAPS_D?"правил":"слов"} · выучено ${k}</small></span><span class="dbar"><u style="width:${p}%"></u></span></button>`};
  app().innerHTML=`<div class="card">${say(kn?`Ты уже выучил(а) <b>${kn} из ${all}</b> слов. Выбери тему и повтори карточки, а потом проверь себя в тесте.`:`Здесь вся лексика для ОГЭ: <b>${all} слов</b> по ${LEX.decks.length} темам и слова-ловушки. Переворачивай карточки, отмечай, что уже знаешь, и проверяй себя в тесте.`,"happy",true)}</div>
  <section class="part"><h2>Лексика <span class="acc">по темам ОГЭ</span></h2><div class="decks">${LEX.decks.map((_,d)=>tile(d)).join("")}</div></section>
  <section class="part"><h2>Типичные ошибки</h2><div class="decks">${tile(TRAPS_D)}</div></section>`;
  app().querySelectorAll("[data-deck]").forEach(b=>b.onclick=()=>{LX.d=+b.dataset.deck;LX.f=-1;LX.unk=false;setView("deck")});
}

/* one topic: filters, modes, word list */
function renderDeck(){
  const d=LX.d,cards=deckCards(d),trap=d===TRAPS_D,n=cards.length,k=knownIn(d);
  const secs=trap?[]:[...new Set(cards.map(c=>c.s))].sort((a,b)=>a-b);
  const P=pool(d),short=P.filter(c=>c.en.length<=34&&c.ru.length<=34);
  const dot=c=>{const s=lexState(c.k);return `<i class="ld ${s===2?"k":s===1?"l":""}" title="${s===2?"Знаю":s===1?"Учу":"Новое"}"></i>`};
  app().innerHTML=`<section class="card sheet">
    <div><div class="eyebrow">Лексика</div><h2>${esc(deckName(d))}</h2></div>
    <div class="xpbar"><u style="width:${Math.round(100*k/n)}%"></u></div>
    <div class="xpmeta"><span>Выучено ${k} из ${n}</span><span>${n-k} осталось</span></div>
    ${secs.length>1?`<div class="chips2"><button class="chip2 ${LX.f<0?"on":""}" data-f="-1">Все</button>${secs.map(s=>`<button class="chip2 ${LX.f===s?"on":""}" data-f="${s}">${esc(LEX.secs[s])}</button>`).join("")}</div>`:""}
    <label class="toggle"><input type="checkbox" id="unk" ${LX.unk?"checked":""}> Только невыученные</label>
    <div class="lxmodes">
      <button class="lxm main" data-m="cards" ${P.length?"":"disabled"}><b>Карточки</b><span>Переворачивай и отмечай: знаю или ещё учу</span></button>
      ${trap?"":`<button class="lxm" data-m="learn" ${P.length>=4?"":"disabled"}><b>Тест</b><span>Выбери правильный перевод из 4 вариантов</span></button>
      <button class="lxm" data-m="match" ${short.length>=4?"":"disabled"}><b>Подбор пар</b><span>Найди пары слово — перевод на время${G.lexBest&&G.lexBest[d]?` · рекорд ${(G.lexBest[d]/10).toFixed(1)} с`:""}</span></button>`}
    </div>
    ${P.length?"":`<p class="hint">В этом наборе все слова уже выучены. Сними галочку «Только невыученные», чтобы повторить всё.</p>`}
  </section>
  <section class="part"><h3>${trap?"Все правила":"Все слова"} (${P.length})</h3>
    <div class="wlist">${P.map(c=>trap?`<div class="wrow">${dot(c)}<span class="we">${esc(c.en)}</span><span class="wr">${esc(c.trap[1])}</span></div>`:`<div class="wrow">${dot(c)}<span class="we">${esc(c.en)}</span><span class="wr">${esc(c.ru)}</span>${spkBtn(c.en)}</div>`).join("")}</div>
    <p class="hint"><i class="ld k"></i> знаю · <i class="ld l"></i> ещё учу · <i class="ld"></i> новое</p></section>`;
  app().querySelectorAll("[data-f]").forEach(b=>b.onclick=()=>{LX.f=+b.dataset.f;renderDeck()});
  app().querySelector("#unk").onchange=e=>{LX.unk=e.target.checked;renderDeck()};
  app().querySelectorAll("[data-m]").forEach(b=>b.onclick=()=>({cards:startCards,learn:startLearn,match:startMatch})[b.dataset.m]());
  wireSpeak();
}

/* flip cards: tap to flip, swipe or buttons to sort */
function startCards(list){LX.q={list:shuffle(list||pool(LX.d)),i:0,flip:false,know:0,learn:[],ruFirst:LX.q&&LX.q.ruFirst||false};setView("cards")}
function renderCards(){
  const q=LX.q,d=LX.d,trap=d===TRAPS_D;
  if(!q||!q.list){setView("deck");return}
  if(q.i>=q.list.length){
    const all=q.know===q.list.length;
    app().innerHTML=`<section class="card sheet"><div class="eyebrow">${esc(deckName(d))} · итог</div>
      <div class="score"><span class="big">${q.know}</span><span class="of">из ${q.list.length} — знаю</span></div>
      ${say(all?"Все карточки знаешь! Проверь себя в тесте, чтобы закрепить.":`Осталось повторить <b>${q.learn.length}</b>. Пройди их ещё раз, пока все не станут «знаю».`,all?"wow":"happy",true)}
      <div class="row">${q.learn.length?`<button class="btn" id="again">Повторить невыученные (${q.learn.length})</button>`:""}<button class="btn ${q.learn.length?"ghost":""}" id="all">Ещё раз все</button><button class="btn ghost" id="todeck">К теме</button></div></section>`;
    const a=app().querySelector("#again");if(a)a.onclick=()=>startCards(q.learn);
    app().querySelector("#all").onclick=()=>startCards(pool(d).length?pool(d):deckCards(d));app().querySelector("#todeck").onclick=()=>setView("deck");return;
  }
  const c=q.list[q.i],front=trap?c.en:q.ruFirst?c.ru:c.en;
  const back=trap?`<div class="trapb"><p>${fmt(c.trap[1])}</p>${c.trap[2]?`<p class="tb">✗ ${esc(c.trap[2])}</p>`:""}${c.trap[3]?`<p class="tg">✓ ${esc(c.trap[3])}</p>`:""}</div>`:`<div class="fw">${esc(q.ruFirst?c.en:c.ru)}</div>${q.ruFirst?spkBtn(c.en):""}`;
  const st=lexState(c.k);
  app().innerHTML=`<section class="card sheet">
    <div class="sheet-head"><div><div class="eyebrow">Карточки · ${q.i+1} из ${q.list.length}</div><h2>${esc(deckName(d))}</h2></div>
      ${trap?"":`<label class="toggle"><input type="checkbox" id="rf" ${q.ruFirst?"checked":""}> Сначала русский</label>`}</div>
    <div class="progress"><u style="width:${100*q.i/q.list.length}%"></u></div>
    <div class="flip"><div class="fcard ${q.flip?"on":""} ${trap?"tall":""}" id="fc" role="button" tabindex="0" aria-label="Перевернуть карточку">
      <div class="face"><span class="fsec">${trap?"Слово-ловушка":c.s>=0?esc(LEX.secs[c.s]):""}${st===2?" · знаю":st===1?" · учу":""}</span><div class="fw">${esc(front)}</div>${!trap&&!q.ruFirst?spkBtn(c.en):""}<span class="fhint">Нажми, чтобы перевернуть</span></div>
      <div class="face back">${back}</div></div></div>
    <div class="sortbtns"><button class="btn ghost" id="lrn">← Ещё учу</button><button class="btn" id="kn">Знаю →</button></div>
    <p class="hint">На телефоне можно смахивать карточку: вправо — знаю, влево — ещё учу.${canSpeak?" Значок динамика — послушать произношение.":""}</p></section>`;
  const fc=app().querySelector("#fc");
  const flip=()=>{q.flip=!q.flip;fc.classList.toggle("on",q.flip)};
  const next=know=>{setLex(c.k,know?2:1);if(know)q.know++;else q.learn.push(c);q.i++;q.flip=false;renderCards();toastNext()};
  app().querySelector("#kn").onclick=()=>next(true);app().querySelector("#lrn").onclick=()=>next(false);
  const rf=app().querySelector("#rf");if(rf)rf.onchange=e=>{q.ruFirst=e.target.checked;q.flip=false;renderCards()};
  let x0=null,dx=0;
  fc.addEventListener("pointerdown",e=>{if(e.target.closest("[data-say]"))return;x0=e.clientX;dx=0;try{fc.setPointerCapture(e.pointerId)}catch(_){}});
  fc.addEventListener("pointermove",e=>{if(x0==null)return;dx=e.clientX-x0;if(Math.abs(dx)>8)fc.parentNode.style.transform=`translateX(${dx}px) rotate(${dx/25}deg)`});
  fc.addEventListener("pointerup",()=>{if(x0==null)return;fc.parentNode.style.transform="";const m=dx;x0=null;if(m>70)next(true);else if(m<-70)next(false);else if(Math.abs(m)<8)flip()});
  fc.addEventListener("pointercancel",()=>{x0=null;fc.parentNode.style.transform=""});
  fc.addEventListener("keydown",e=>{if(e.key===" "||e.key==="Enter"){e.preventDefault();flip()}});
  document.onkeydown=e=>{if(view!=="cards"||e.target.tagName==="INPUT")return;if(e.key==="ArrowRight")next(true);else if(e.key==="ArrowLeft")next(false);else if(e.key===" "&&e.target===document.body){e.preventDefault();flip()}};
  wireSpeak();
}

/* test: pick the translation out of four */
function distractors(c,dir){const key=dir?"en":"ru";
  let cand=deckCards(LX.d).filter(x=>x[key]!==c[key]&&x.s===c.s);
  if(cand.length<3)cand=cand.concat(deckCards(LX.d).filter(x=>x[key]!==c[key]&&x.s!==c.s));
  return shuffle([...new Set(cand.map(x=>x[key]))]).slice(0,3)}
function startLearn(){const P=shuffle(pool(LX.d)).slice(0,15);
  LX.q={test:P.map(c=>{const dir=Math.random()<.5;return{c,dir,ord:shuffle([dir?c.en:c.ru].concat(distractors(c,dir)))}}),i:0,ok:0,ans:null};setView("learn")}
function renderLearn(){
  const q=LX.q;if(!q||!q.test){setView("deck");return}
  if(q.i>=q.test.length){const pct=q.ok/q.test.length;
    app().innerHTML=`<section class="card sheet"><div class="eyebrow">${esc(deckName(LX.d))} · тест</div>
      <div class="score"><span class="big">${q.ok}</span><span class="of">из ${q.test.length} верно</span></div>
      ${say(pct===1?"Идеально! Эти слова ты знаешь.":pct>=.7?"Хорошо! Слова с ошибками я отметила как «ещё учу» — повтори их в карточках.":"Слова с ошибками я отметила как «ещё учу». Повтори их в карточках и попробуй тест снова.",pct===1?"wow":pct>=.7?"happy":"worry",true)}
      <div class="row"><button class="btn" id="again">Новый тест</button><button class="btn ghost" id="todeck">К теме</button></div></section>`;
    app().querySelector("#again").onclick=startLearn;app().querySelector("#todeck").onclick=()=>setView("deck");return}
  const t=q.test[q.i],right=t.dir?t.c.en:t.c.ru,ask=t.dir?t.c.ru:t.c.en;
  app().innerHTML=`<section class="card sheet">
    <div class="sheet-head"><div><div class="eyebrow">Тест · ${q.i+1} из ${q.test.length}</div><h2>${esc(deckName(LX.d))}</h2></div><div class="hud">${G.combo>=2?`<span class="combo">Серия ×${G.combo}</span>`:""}</div></div>
    <div class="progress"><u style="width:${100*q.i/q.test.length}%"></u></div>
    <p class="hint">${t.dir?"Как это по-английски?":"Выбери перевод"}</p>
    <div class="ask">${esc(ask)}${t.dir?"":spkBtn(ask)}</div>
    <div class="opts">${t.ord.map((o,n)=>{const s=q.ans==null?"":o===right?"ok":o===q.ans?"bad":"gone";return `<button class="opt lx ${s}" data-o="${esc(o)}" ${q.ans!=null?"disabled":""}><span class="k">${n+1}</span>${esc(o)}</button>`}).join("")}</div>
    ${q.ans!=null?`<div class="row"><button class="btn" id="next">${q.i+1<q.test.length?"Дальше":"Итог"}</button></div>`:""}</section>`;
  const choose=o=>{if(q.ans!=null)return;q.ans=o;const ok=o===right;if(ok){q.ok++;G.combo++;G.bestCombo=Math.max(G.bestCombo,G.combo);if(G.combo>=5)unlock("combo5");if(G.combo>=10)unlock("combo10")}else G.combo=0;
    setLex(t.c.k,ok?2:1);renderLearn();setTimeout(()=>{const n=app().querySelector("#next");if(n)n.focus()},300);toastNext()};
  app().querySelectorAll(".opt:not(:disabled)").forEach(b=>b.onclick=()=>choose(b.dataset.o));
  const nx=app().querySelector("#next");if(nx)nx.onclick=()=>{q.i++;q.ans=null;renderLearn()};
  document.onkeydown=e=>{if(view!=="learn"||q.ans!=null)return;const n=+e.key;if(n>=1&&n<=4)choose(t.ord[n-1])};
  wireSpeak();
}

/* match: six pairs against the clock */
function startMatch(){const P=shuffle(pool(LX.d).filter(c=>c.en.length<=34&&c.ru.length<=34)).slice(0,6);
  LX.q={pairs:P,tiles:shuffle(P.flatMap((c,i)=>[{i,t:c.en,en:1},{i,t:c.ru,en:0}])),done:[],sel:null,t0:null,t:0,miss:0};setView("match")}
function renderMatch(){
  const q=LX.q;if(!q||!q.tiles){setView("deck");return}
  if(q.done.length===q.pairs.length){const best=G.lexBest&&G.lexBest[LX.d];const rec=!best||q.t<best;
    if(rec){G.lexBest=G.lexBest||{};G.lexBest[LX.d]=q.t;persist()}
    app().innerHTML=`<section class="card sheet"><div class="eyebrow">${esc(deckName(LX.d))} · подбор пар</div>
      <div class="score"><span class="big">${(q.t/10).toFixed(1)} с</span><span class="of">${q.miss?`ошибок: ${q.miss}`:"без ошибок"}</span></div>
      ${say(rec?"Новый рекорд! Сможешь ещё быстрее?":`Твой рекорд — ${(best/10).toFixed(1)} с. Попробуй его побить!`,rec?"wow":"happy",true)}
      <div class="row"><button class="btn" id="again">Ещё раз</button><button class="btn ghost" id="todeck">К теме</button></div></section>`;
    app().querySelector("#again").onclick=startMatch;app().querySelector("#todeck").onclick=()=>setView("deck");return}
  app().innerHTML=`<section class="card sheet">
    <div class="sheet-head"><div><div class="eyebrow">Подбор пар</div><h2>${esc(deckName(LX.d))}</h2></div><span class="timer" id="tm">${(q.t/10).toFixed(1)} с</span></div>
    <p class="hint">Сопоставь слово с его переводом. Отсчёт времени начнётся с первого нажатия.</p>
    <div class="mgrid"><div class="mcol">${q.tiles.map((x,n)=>[x,n]).filter(([x])=>x.en).map(([x,n])=>`<button class="mt en ${q.done.includes(x.i)?"done":""} ${q.sel===n?"sel":""}" data-n="${n}" ${q.done.includes(x.i)?"disabled":""}>${esc(x.t)}</button>`).join("")}</div><div class="mcol">${q.tiles.map((x,n)=>[x,n]).filter(([x])=>!x.en).map(([x,n])=>`<button class="mt ru ${q.done.includes(x.i)?"done":""} ${q.sel===n?"sel":""}" data-n="${n}" ${q.done.includes(x.i)?"disabled":""}>${esc(x.t)}</button>`).join("")}</div></div></section>`;
  app().querySelectorAll(".mt:not(:disabled)").forEach(b=>b.onclick=()=>{const n=+b.dataset.n,x=q.tiles[n];
    if(q.t0==null){q.t0=Date.now();q.timer=setInterval(()=>{if(view!=="match"||!LX.q||LX.q!==q){clearInterval(q.timer);return}q.t=Math.round((Date.now()-q.t0)/100);const el=document.getElementById("tm");if(el)el.textContent=(q.t/10).toFixed(1)+" с"},100)}
    if(q.sel==null||q.sel===n){q.sel=q.sel===n?null:n;renderMatch();return}
    const y=q.tiles[q.sel];
    if(y.i===x.i&&y.en!==x.en){q.done.push(x.i);q.sel=null;if(q.done.length===q.pairs.length){clearInterval(q.timer);q.t=Math.round((Date.now()-q.t0)/100)}renderMatch()}
    else{q.miss++;const a=app().querySelector(`[data-n="${q.sel}"]`);b.classList.add("no");if(a)a.classList.add("no");q.sel=null;setTimeout(renderMatch,350)}});
}

/* ---------- lessons ---------- */
function lessonCard(l){const t=T[l.topic];return `<a class="lesson" href="${esc(l.url)}" target="_blank" rel="noopener"><span class="play" aria-hidden="true"></span><span class="lt"><b>${esc(l.title)}</b><small>${t?esc(t.name):"Общий урок"}</small></span></a>`}
function renderLessons(){
  const Ls=DATA.lessons||[];
  const blocks=[{id:"",name:"Общие уроки"}].concat(TOPICS).map(g=>{const ls=Ls.filter(l=>(l.topic||"")===g.id);return ls.length?`<section class="part"><h3>${esc(g.name)}</h3><div class="lessons">${ls.map(lessonCard).join("")}</div></section>`:""}).join("");
  app().innerHTML=`<div class="card">${say(`Здесь мои видеоуроки по темам заданий. Если ошибся(лась) в задании, я сразу подскажу нужное видео. <a class="lesson-inline" href="${CHANNEL}" target="_blank" rel="noopener">Все видео на канале</a>`,"happy",true)}</div>
  ${tgCard()}
  ${blocks||`<div class="empty"><b>Уроки скоро появятся.</b><span>Учитель добавляет ссылки на видео в разделе «Для учителя».</span></div>`}`;
}

/* ---------- teacher ---------- */
function topicOptions(sel,p,general){return (general?`<option value="">Общий урок</option>`:"")+["g","w"].filter(x=>!p||x===p).map(x=>`<optgroup label="${x==="g"?"20–28 грамматика":"29–34 словообразование"}">${TOPICS.filter(t=>t.p===x).map(t=>`<option value="${t.id}" ${t.id===sel?"selected":""}>${esc(t.name)}</option>`).join("")}</optgroup>`).join("")}
function renderTeacher(){
  if(!canEdit){setView("home");return}
  const Ls=DATA.lessons||[];
  app().innerHTML=`<p class="hint">Всё, что вы сохраняете здесь, записывается прямо в тренажёр. Ученики увидят изменения по той же ссылке, без входа в аккаунт.</p>
  <section class="part"><h2>Видеоуроки</h2>
  <form class="panel" id="lf"><div class="grid2">
    <div class="field"><label for="lt">Название</label><input id="lt" required placeholder="Present Perfect за 10 минут"></div>
    <div class="field"><label for="lu">Ссылка на YouTube</label><input id="lu" required inputmode="url" placeholder="https://youtu.be/…"></div></div>
    <div class="field"><label for="ltp">Тема</label><select id="ltp">${topicOptions("",null,true)}</select></div>
    <div class="row"><button class="btn">Добавить урок</button><span class="msg" id="lm"></span></div></form>
  <div class="list">${Ls.length?Ls.map((l,i)=>`<div class="li"><span class="lc">${esc(l.title)}<br><small>${esc(T[l.topic]?T[l.topic].name:"Общий урок")} · ${esc(l.url)}</small></span><button class="del" data-del="${i}">Удалить</button></div>`).join(""):`<div class="li"><span class="lc"><small>Уроков пока нет.</small></span></div>`}</div></section>
  <section class="part"><h2>Ключи к текстам</h2>
  <p class="hint">Ключи составлены по текстам банка. Чтобы принять другой вариант ответа, допишите его через косую черту: <span class="ans">were passing / passed</span>. Сокращения вроде didn’t засчитываются автоматически.</p>
  <div class="panel"><div class="field"><label for="tidq">Найти текст</label><input id="tidq" placeholder="Несколько слов из текста, например: light was on in Ted’s room" autocomplete="off"></div><div id="found"></div><div id="keyed"></div><span class="msg" id="km"></span></div></section>`;
  const lf=app().querySelector("#lf");
  lf.onsubmit=async e=>{e.preventDefault();const m=app().querySelector("#lm");const url=app().querySelector("#lu").value.trim();
    if(!/^https:\/\/(www\.|m\.)?(youtube\.com|youtu\.be)\//.test(url)){m.className="msg err";m.textContent="Нужна ссылка на YouTube, начинающаяся с https://";return}
    const next=structuredClone(DATA);next.lessons=(next.lessons||[]).concat([{title:app().querySelector("#lt").value.trim(),url,topic:app().querySelector("#ltp").value}]);
    await save(next,m,"Урок добавлен")};
  app().querySelectorAll("[data-del]").forEach(b=>b.onclick=async()=>{if(!b.dataset.armed){b.dataset.armed="1";b.textContent="Точно удалить?";return}
    b.disabled=true;const next=structuredClone(DATA);next.lessons.splice(+b.dataset.del,1);await save(next,app().querySelector("#lm"),"Урок удалён")});
  const q=app().querySelector("#tidq");q.addEventListener("input",()=>findTexts(q.value));
}
function findTexts(qv){
  const f=app().querySelector("#found"),box=app().querySelector("#keyed");const q=norm(qv);box.innerHTML="";
  if(q.length<4){f.innerHTML="";return}
  const hits=DATA.texts.filter(t=>t.id.toLowerCase()===q||norm(t.s.join(" ")).includes(q)).slice(0,6);
  if(!hits.length){f.innerHTML=`<p class="hint">Таких слов нет ни в одном тексте.</p>`;return}
  if(hits.length===1){f.innerHTML="";drawKeyEditor(hits[0].id);return}
  f.innerHTML=`<div class="bank">${hits.map(t=>`<button class="bankrow" data-pick="${esc(t.id)}"><span class="bt">${esc(t.s[0].slice(0,110))}…</span><span class="bs">${t.k==="g"?"20–28":"29–34"}</span></button>`).join("")}</div>`;
  f.querySelectorAll("[data-pick]").forEach(b=>b.onclick=()=>{f.innerHTML="";drawKeyEditor(b.dataset.pick)});
}
function drawKeyEditor(id){
  const box=app().querySelector("#keyed");const t=DATA.texts.find(x=>x.id===id);
  if(!t){box.innerHTML="";return}
  const start=t.k==="g"?20:29;
  box.innerHTML=`<p class="hint">${esc(t.s[0].slice(0,140))}…</p>`+t.g.map((g,i)=>`<div class="keyedit"><span class="tid">${start+i}</span><span class="word">${esc(g.w)}</span><input id="ka${i}" value="${esc(g.a.join(" / "))}" aria-label="Ключ к заданию ${start+i}"><select id="kt${i}" aria-label="Тема задания ${start+i}">${topicOptions(g.t,t.k,false)}</select></div>`).join("")+`<div class="row" style="margin-top:8px"><button class="btn small" id="ksave">Сохранить ключи</button></div>`;
  box.querySelector("#ksave").onclick=async()=>{const next=structuredClone(DATA);const nt=next.texts.find(x=>x.id===id);
    for(let i=0;i<nt.g.length;i++){const a=box.querySelector("#ka"+i).value.split("/").map(x=>x.trim()).filter(Boolean);if(!a.length){const m=app().querySelector("#km");m.className="msg err";m.textContent=`Заполните ключ к заданию ${start+i}.`;return}nt.g[i].a=a;nt.g[i].t=box.querySelector("#kt"+i).value}
    await save(next,app().querySelector("#km"),"Ключи сохранены")};
}

/* ---------- saving: the page republishes itself with the new data ---------- */
const RESET_FALLBACK=":root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,-apple-system,sans-serif}img{max-width:100%}[hidden]{display:none!important}";
function buildDoc(data){
  const headStyle=document.head&&document.head.querySelector("style");
  const reset=headStyle&&headStyle.id!=="appcss"?headStyle.textContent:RESET_FALLBACK;
  const font=document.querySelector('link[rel="stylesheet"]');
  const json=JSON.stringify(data).replace(/</g,"\\u003c");
  const page=`<title>Тренажер ОГЭ | ОГЭ на excellent</title>\n<meta name="claude:viewport-fit-sides" content="cover">\n<link rel="stylesheet" href="${font?font.getAttribute("href"):""}">\n<style id="appcss">${document.getElementById("appcss").textContent}</style>\n<div class="wrap" id="root"></div>\n<script type="application/json" id="data">${json}<\/script>\n<script id="appjs">${document.getElementById("appjs").textContent}<\/script>`;
  return `<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>${reset}</style></head><body>${page}</body></html>`;
}
async function save(next,msg,okText){
  msg.className="msg";msg.textContent="Сохраняю…";
  if(!artifactApi){msg.className="msg err";msg.textContent="Сохранение недоступно в этом окне. Откройте тренажёр на claude.ai.";return}
  try{await artifactApi.publish(buildDoc(next));msg.className="msg okm";msg.textContent=okText+". Страница обновится.";}
  catch(e){msg.className="msg err";const c=e&&e.code;
    msg.textContent=c==="conflict"?"Тренажёр только что изменили в другом окне. Страница обновится, повторите правку.":c==="not_writer"||c==="not_granted"?"Изменять тренажёр может только автор.":"Не удалось сохранить. Проверьте соединение и попробуйте ещё раз."}
}

/* the day-streak flame: greets a returning student and celebrates when today's first answer extends the series */
const daysWord=n=>n%10===1&&n%100!==11?"день":n%10>=2&&n%10<=4&&(n%100<12||n%100>14)?"дня":"дней";
function showFlame(n,mode){
  if(document.getElementById("fov"))return;
  const el=document.createElement("div");el.id="fov";el.className="fov";el.setAttribute("role","dialog");el.setAttribute("aria-modal","true");el.setAttribute("aria-label","Огонёк");
  const back=mode==="back";
  el.innerHTML=`<div class="fbox">${IC.fire.replace("<svg",'<svg class="bigfire"')}<div class="fnum">${n}</div>
    <h2>${back?"Ты снова здесь!":"Огонёк горит!"}</h2>
    <p>${back?`Огонёк горит уже ${n} ${daysWord(n)} подряд. Реши сегодня хотя бы одно задание, и серия вырастет до ${n+1}.`:`${n} ${daysWord(n)} подряд, так держать! Возвращайся завтра, чтобы не прервать серию.`}</p>
    <button class="btn" id="fok">${back?"Продолжить серию":"Ура!"}</button></div>`;
  document.body.appendChild(el);
  const close=()=>{el.remove();document.removeEventListener("keydown",esc)};const esc=e=>{if(e.key==="Escape")close()};
  el.querySelector("#fok").onclick=close;el.addEventListener("click",e=>{if(e.target===el)close()});document.addEventListener("keydown",esc);
  setTimeout(()=>{const b=el.querySelector("#fok");if(b)b.focus()},50)}
function greetFlame(){try{if(G.last===yesterday()&&G.streak>=1&&G.seenDay!==today()){G.seenDay=today();persist();setTimeout(()=>showFlame(G.streak,"back"),700)}}catch(e){}}
shell();routing=true;setView("home");routing=false;route();greetFlame();
(async()=>{
  if(!window.claude||!claude.use)return;
  const [u,a]=await Promise.all([claude.use("user"),claude.use("artifact")]);
  artifactApi=a;canEdit=u?await u.canEdit():false;
  document.getElementById("teacherTab").hidden=!(canEdit&&a);
})();
</script>
