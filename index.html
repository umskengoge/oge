im at home, we made him wear a special tag. Our address "," on it in large printed letters. Mum said: “If one day Lucky gets missing, the tag "," us find him”. Lucky disappeared on the "," day after moving house. We looked for the cat everywhere. We asked all our new neighbours about him. We even asked all the "," in our district if they had seen him. But nobody had seen a cat that looked like our Lucky. In the end, we "," hope. Two weeks later I was passing by our old house. On the porch there was a cat that looked strikingly like Lucky. And it was Lucky! I grabbed him and brought him home. “Mum, look who I ","!” I cried to mum. “The new owner told me the cat had been waiting for us in our old house. Nobody could inform us about him because the address on the cat’s tag is our old address.”"],"g":[{"w":"HE","a":["him"],"t":"pron"},{"w":"BE","a":["were","was"],"t":"cond"},{"w":"NOT/CAN","a":["could not"],"t":"modal"},{"w":"WRITE","a":["was written"],"t":"pass","cb":1},{"w":"HELP","a":["will help"],"t":"cond"},{"w":"THREE","a":["third"],"t":"num"},{"w":"POLICEMAN","a":["policemen"],"t":"pl"},{"w":"LOSE","a":["lost","had lost"],"t":"past"},{"w":"FIND","a":["have found","found"],"t":"presperf"}]},{"id":"910A9B","k":"g","s":["I come from England but now I live permanently in Québec, Canada. When my parents "," me to Canada, I was fifteen. It was the winter and I "," by the amount of snow there. I asked my new friends what they usually "," for entertainment in such a cold climate. Their answer was simple, “In winter "," and adults go skiing and skating.” Before arriving in Canada, I had never tried skating and my Canadian ice experience was really painful. To start with, it took "," half an hour to put on the skates. I "," how to move so my new friends showed me some basic techniques. However, when I was left alone on the ice, I "," over immediately. When I opened my eyes, my new friends were standing around. They weren’t laughing, they looked worried. “Are you OK?” they ake the bird home. The next day we took the crow to the vet. The vet fixed and bandaged the wing and explained to "," what medicines we should give to the bird. “Ok,” he said, as we left, “I "," everything I can. There’s no need to bring this crow here any more. The bird is young and strong, and I think it "," soon. This is the good news. The bad news is that it will never be able to fly again.” “We’ll see,” my son "," to agree with this fact too easily."],"g":[{"w":"BE","a":["were"],"t":"past","th":1},{"w":"BRING","a":["brought"],"t":"past"},{"w":"BREAK","a":["was broken"],"t":"pass"},{"w":"TAKE","a":["would take"],"t":"reported"},{"w":"OLD","a":["older"],"t":"comp"},{"w":"WE","a":["us"],"t":"pron"},{"w":"DO","a":["have done"],"t":"presperf"},{"w":"RECOVER","a":["will recover"],"t":"futsimple"},{"w":"NOT/WANT","a":["did not want"],"t":"past"}]},{"id":"98F2E4","k":"g","s":["Kate called me early in the morning. It was the "," day of holidays; I felt angry with her for waking me up. “What ","?” I didn’t sound very polite, but she paid no attention to that. “Oh, nothing! I want to go shopping today and wondered if you wanted to go with ",".” “No, I don’t want to.” “But it "," you long! I promise”. My first impulse was to say “no” – unlike most "," I hated shopping. But Kate sounded so unhappy that I felt sorry for her. “Ok, what do you need to buy?” Kate’s voice "," cheerful again. She excitedly explained to me that she "," to buy a pair of hiking boots and a raincoat. That "," strange as Kate had never been fond of hiking. “I want to take up hiking as a new hobby,” went on Kate. “Bob Smith says that it’s very exciting.” Now I knew what was going on. Bob Smith, the captain of the school baseball team, was the "," boy in our school. All the girls wanted to attract his attention."],"g":[{"w":"TWO","a":["second"],"t":"num"},{"w":"HAPPEN","a":["has happened","happened"],"t":"presperf"},{"w":"I","a":["me"],"t":"pron"},{"w":"NOT/TAKE","a":["will not take"],"t":"futsimple"},{  to leave, the old woman said, “I know you are friends. But never come to our house again. Never ever!” The girl took the boy to the gate. “Will you miss me?” she asked. The boy said, “Yes, I will!” To his surprise, the girl said, “But I won’t! I "," to see you anymore!” She closed the gate. The next day the girl "," for the city. Steven was upset but he hoped that one day he "," Eliza again. Five years later Steven became a student and moved to the city. He rented a small apartment on the "," floor. One day, when he "," to the university, he saw Eliza. She was sitting on the bench in the park with an ice-cream in her hand. He ran up to her and said “Hello! It’s nice to see you again!” But Eliza looked up at ",", stood up and walked away. “I wish I "," what is going on,” Steven said to himself, and decided to start his own investigation."],"g":[{"w":"CHILD","a":["children"],"t":"pl"},{"w":"BE","a":["was"],"t":"past"},{"w":"NOT/WANT","a":["do not want"],"t":"pres"},{"w":"LEAVE","a":["left"],"t":"past"},{"w":"SEE","a":["would see"],"t":"reported"},{"w":"ONE","a":["first"],"t":"num"},{"w":"WALK","a":["was walking"],"t":"pastcont"},{"w":"HE","a":["him"],"t":"pron"},{"w":"KNOW","a":["knew"],"t":"cond"}]},{"id":"348166","k":"g","s":["The camel was very thirsty. His last drink had been weeks ago. His feet sank in the hot sand and he "," hardly move. \"When will I reach water?\" he thought. \"And I "," for ages.\" It was obvious that if the camel didn’t find any water and food soon, he ",". He made a few steps toward another dune. It was "," to walk along the top of a hill, than along the bottom. At last, he "," something green in the distance. Was it a mirage or an oasis? He hoped for the best and the hope helped "," move faster. Soon, that distant green colour turned into real trees and grass. There "," a small stream of water and some palm trees that gave shade. Their wide "," could protect the camel from the sun's rays. Though the sun ",", it didn’t burn anymore. Unfort w":"LEARN","a":["learns"],"t":"pres"}]},{"id":"95C331","k":"g","s":["It was a great day yesterday. My friends and I "," to see a performance at the Bolshoi Theatre. You certainly know that the Bolshoi Theatre is the "," theatre in Russia and probably in the world. But not everyone "," the history of the Bolshoi Theatre. According to historical documents, it "," in March 1776 when Prince Pyotr Urusov was granted Royal permission to build a public theatre in Moscow. Catherine II, Empress of Russia, was fond of arts. She "," having a new theatre in her country. The original building of the theatre had a hall with almost 1,000 seats, a stage and an orchestra pit. Directly over the stage there "," boxes where the most noble fans of the theatre had their seats. The theatre has changed several times during "," history. The building we can see today opened in 1825. It "," by architect Andrei Mikhailov who was also the architect of the Maly Theatre. Since that time, the building has been rebuilt and renovated several times. Now it looks beautiful from the inside and outside. If I "," the opportunity to go there more often, I would do it every week."],"g":[{"w":"GO","a":["went"],"t":"past"},{"w":"FAMOUS","a":["most famous"],"t":"comp"},{"w":"KNOW","a":["knows"],"t":"pres"},{"w":"BEGIN","a":["began"],"t":"past"},{"w":"NOT/MIND","a":["did not mind"],"t":"past"},{"w":"BE","a":["were"],"t":"past","th":1},{"w":"IT","a":["its"],"t":"pron"},{"w":"DESIGN","a":["was designed"],"t":"pass"},{"w":"HAVE","a":["had"],"t":"cond"}]},{"id":"20783C","k":"g","s":["After school, I decided to go to university. I "," St Andrews University in Scotland. At that time I "," much about the University but when I arrived there, I liked it at once. Now I'm in my last year and I wish I "," stay here forever! St Andrews University is a truly special place. It "," 600 years ago and it is one of the oldest universities in the English-speaking world. It has many traditions – for example, the ‘May Dip’. It is held on the "," of May every year. All the students run into the North Sea at sunrise to celebrate the coming of spring and for good luck! One of my classmates said that the tradition "," him to pass his exams last summer. For me the ‘May Dip’ was the "," experience of my life! Because the weather is famously cold, St Andrews students designed "," own uniform which consists of a warm jacket, jeans and boat shoes. The uniform "," us all look the same, but it is the only way to keep warm!"],"g":[{"w":"CHOOSE","a":["chose"],"t":"past"},{"w":"NOT/KNOW","a":["did not know"],"t":"past"},{"w":"CAN","a":["could"],"t":"cond"},{"w":"BUILD","a":["was built"],"t":"pass"},{"w":"ONE","a":["first"],"t":"num"},{"w":"HELP","a":["helped"],"t":"past"},{"w":"COLD","a":["coldest"],"t":"comp"},{"w":"THEY","a":["their"],"t":"pron"},{"w":"MAKE","a":["makes"],"t":"pres"}]},{"id":"5AEA36","k":"g","s":["Martin and Jane were shopping. They were in the "," shopping centre in their city. In fact, it was their favourite place because it was nice and not very expensive. The centre "," Dress for Less. Unlike most ",", Martin liked shopping. Today he felt really happy because he "," a shirt and a pair of jeans. Jane was still in the changing room so Martin had time for a cup of coffee in the lobby. It was the first time Martin had had a good look at the building itself. The shopping centre building "," impressive. The engineers had used advanced technologies to make it light, warm and spacious. “Hi!” Martin "," Jane’s voice. “What are you having? Coffee? No, I "," coffee. Never. It’s not good for your health. ” “Look, Jane, do you know the name of the architect of this building?” Martin interrupted her. Jane looked puzzled. “I wish we "," change our life a bit,” went on Martin. “We probably spend too much time on things like shopping and miss more important things. When was the last time we visited a museum?” Jane quietly sat down on the chair beside ","."],"g":[{"w":"LARGE","a":["largest"],"t":"comp  My "," impulse was to call the police but I called Jim instead. “What ","?” Jim sounded sleepy. I explained that someone "," the book. “Oh, no!” Jim sounded unhappy. “Do you have any idea how valuable it is?” “There’s another thing I "," understand,” I interrupted Jim. “My computer’s on but I always switch it off before leaving home.” “Ok, stay at home. I’ll be at "," place in half an hour,” he said and the phone went dead."],"g":[{"w":"NOT/REMEMBER","a":["did not remember"],"t":"past"},{"w":"BE","a":["was"],"t":"past","th":1},{"w":"UNDERSTAND","a":["understood"],"t":"past"},{"w":"CLOSE","a":["was closed"],"t":"pass"},{"w":"ONE","a":["first"],"t":"num"},{"w":"HAPPEN","a":["has happened","happened"],"t":"presperf"},{"w":"TAKE","a":["had taken"],"t":"pastperf"},{"w":"NOT/CAN","a":["cannot"],"t":"modal"},{"w":"YOU","a":["your"],"t":"pron"}]},{"id":"87033B","k":"g","s":["Jenny loved climbing. It was a strange hobby for a girl and her family wanted her to stop it, but Jenny "," to anybody. \"There are still several trees in the garden I haven’t climbed yet,\" Jenny said. One day, she "," the apple tree in the yard, when she suddenly slipped and fell down. Jenny "," a terrible pain and started to cry. Her mum came outside and saw that her hand was swollen and looked dark. \"I wish you "," some other hobby!\" she said. \"Jenny, please, promise "," that you'll never do this silly climbing again!\" Jenny nodded. Her mother took Jenny to the doctor. It turned out that two of the bones ",". For the "," time Jenny had a cast on her arm, from her fingers down to her elbow. For several weeks, Jenny had to have the cast on. It was a huge relief to get it off, finally. At last, she could get back to her favourite "," which were running, swimming, and climbing. But now climbing was out – Jenny was determined to stick to her promise. “If I break my promise, mum "," upset. And I don’t want her to feel like this.”"],"g":[{"w":"NOT/LISTEN","a":["did not listen"],"t":"past"},{"w":"CLIMB s making birdhouses. He always said that he "," a hobby to fill his free time. Grandpa’s workshop was full of all kinds of tools. There "," a big table, hammers, nails, paints, and what not. And all the tools "," carefully in their places. That was Grandpa’s number one rule. The "," rule was, “Never buy a new tool if the old one still works.” In the workshop, when he "," the birdhouses, I asked him lots of questions about birds. He "," a lot about them! He could tell one bird from another by their songs and footprints. I was surprised that Grandpa "," the birdhouses in bright colours. He explained to "," that birds prefer natural colours that make their houses more difficult to notice and, for that reason, safer."],"g":[{"w":"GOOD","a":["best"],"t":"comp"},{"w":"NEED","a":["needed"],"t":"past"},{"w":"BE","a":["was"],"t":"past","th":1},{"w":"KEEP","a":["were kept"],"t":"pass","cx":[1,0]},{"w":"TWO","a":["second"],"t":"num"},{"w":"MAKE","a":["was making"],"t":"pastcont"},{"w":"KNOW","a":["knew"],"t":"past"},{"w":"NOT/PAINT","a":["did not paint"],"t":"past"},{"w":"I","a":["me"],"t":"pron"}]},{"id":"EA4D8F","k":"g","s":["July 17th was coming. It would be Mark’s "," birthday. His Mum asked him what he "," as a gift. Mark answered at once that his dream was to have a telescope to watch the stars. Mum "," her head doubtfully. She knew that Mark enjoyed learning about space but a telescope was a "," present than they had planned. After dinner the parents had a discussion about the present. “I think we should give Mark the telescope,” Dad said. “But we "," all our savings already,” Mum responded. “We bought some new furniture and paid for our holidays. I wish we "," buy him this present but we really can’t.” “I think, we can,” Dad smiled. “Look, I’ve got an old friend, Nick, whose father was interested in astronomy. His father died many years ago, and Nick keeps all his things in the attic. I think he "," to sell us his telescope at half price.” Nick "," roses in the garden id":"E0C883","k":"g","s":["I remember my uncle Thomas very well. My mum says I can’t because I was a little girl, only three at the time. But my memories of him are still very vivid. Uncle Thomas was a sailor. When he returned from his last trip, he brought several large "," with him. Inside there "," bits of wood, metal, and painted cloth. “What is it for?” I asked my uncle. He "," me a broad smile and said: “Have your breakfast first and then come to the backyard. You "," everything with your own eyes.” When I came to the backyard, Uncle Thomas "," an instruction manual. It took all his attention because the manual "," in Spanish, a language my uncle didn’t know very well. All in all, it took "," a couple of weeks to assemble the object from the parts. To all my questions he said that it was a machine that "," fly like a bird. I was probably the only one in the family who took his words seriously. They could never believe that soon we were going to see one of the "," airplane flights in the country."],"g":[{"w":"BOX","a":["boxes"],"t":"pl"},{"w":"BE","a":["were"],"t":"past","th":1},{"w":"GIVE","a":["gave"],"t":"past"},{"w":"SEE","a":["will see"],"t":"futsimple"},{"w":"READ","a":["was reading"],"t":"pastcont"},{"w":"WRITE","a":["was written"],"t":"pass"},{"w":"HE","a":["him"],"t":"pron"},{"w":"CAN","a":["could"],"t":"modal"},{"w":"ONE","a":["first"],"t":"num"}]},{"id":"8DBD8C","k":"g","s":["Tom woke up relatively early. But he "," at once that he was not the first awake. There was somebody in the kitchen already. Tom went out to inspect, and found that his dad was there – he "," vegetables. It was rather strange – everyone knew that dad "," cooking. “I wish I "," what you are doing,” he said. Dad gave "," a smile and answered “Wait and see.” He pulled out a juicing machine from the cupboard. Nobody had used it for ages and the machine "," with a thin layer of dust. Tom’s dad washed it and turned it on. Then he put a handful of carrots inside. Next he added cucumbers and ",". Dad made three large cups of the stuff. He took one and drank it. He handed the "," cup to Tom. To his surprise the juice tasted really good. “You don’t eat enough vegetables,” his dad said. “If you don’t like eating them, you’ll probably like drinking them.” Tom nodded. It was definitely "," than the stewed vegetables his mum cooked almost every day."],"g":[{"w":"UNDERSTAND","a":["understood"],"t":"past"},{"w":"CUT","a":["was cutting"],"t":"pastcont"},{"w":"NOT/LIKE","a":["did not like"],"t":"past"},{"w":"KNOW","a":["knew"],"t":"cond"},{"w":"HE","a":["him"],"t":"pron"},{"w":"COVER","a":["was covered"],"t":"pass"},{"w":"TOMATO","a":["tomatoes"],"t":"pl"},{"w":"TWO","a":["second"],"t":"num"},{"w":"GOOD","a":["better"],"t":"comp"}]},{"id":"FA4CCC","k":"w","s":["Axel is a 9-year-old Bulgarian orphan. He was adopted by a "," western family. His new father works as a "," in Sweden and he is quite rich. Axel "," wrote e-mails to the director of the orphanage, Jane Smitova. He told her that he was saving his Christmas and birthday money to help his friends. Axel said that he wanted the money to be spent on presents for his former playmates. Later Jane said “I understood that "," meant a lot to a small boy but I would never have imagined that Axel could be talking about such an "," sum of money. It’s so touching and we are going to spend it in a very "," way.\" The boy saved £6,000."],"g":[{"w":"WEALTH","a":["wealthy"],"t":"wa"},{"w":"BANK","a":["banker"],"t":"wn"},{"w":"REGULAR","a":["regularly"],"t":"wadv"},{"w":"FRIEND","a":["friendship"],"t":"wn"},{"w":"POSSIBLE","a":["impossible"],"t":"wpref"},{"w":"CARE","a":["careful"],"t":"wa"}]},{"id":"A2E3C2","k":"w","s":["Father's Day in the UK is on the third Sunday in June. We enjoy this day very much and always arrange a "," at home. Our dad deserves it – he is the most "," person I’ve ever met. He works as a train "," and he loves his job, though it takes time and energy. He cannot spend lots of time with us, but when he is at home, we have a "," time all together. Dad is a very "," person and often invents new games for us. There are three children in our family and we always prepare a present for our dad together. Last time it was a large, "," book about the history of trains. The book starts with the invention of the first train and tells the whole story of the railway up to the present day."],"g":[{"w":"CELEBRATE","a":["celebration"],"t":"wn"},{"w":"AMAZE","a":["amazing"],"t":"wa"},{"w":"DRIVE","a":["driver"],"t":"wn"},{"w":"WONDER","a":["wonderful"],"t":"wa"},{"w":"CREATE","a":["creative"],"t":"wa"},{"w":"COLOUR","a":["colourful","colorful"],"t":"wa"}]},{"id":"1B7142","k":"w","s":["The Grand National is a horse race which is held every year in Liverpool. This "," involves a four-mile race, during which the horses have to go over 30 fences. The most "," horse in the Grand National was called 'Red Rum'. He was the "," of the race three times during the 1970s. The race is not only a sporting event but a "," social event too. Men and women wear beautiful clothes, and the tickets to the race are very ",". The Grand National is broadcast all over the world and around 500 to 600 million people watch it. However, though there are lots of horse racing fans, many people think it’s "," and cruel to make the animals race and jump for people’s entertainment."],"g":[{"w":"COMPETE","a":["competition"],"t":"wn"},{"w":"FAME","a":["famous"],"t":"wa"},{"w":"WIN","a":["winner"],"t":"wn"},{"w":"FASHION","a":["fashionable"],"t":"wa"},{"w":"EXPENSE","a":["expensive"],"t":"wa"},{"w":"FAIR","a":["unfair"],"t":"wpref"}]},{"id":"2BE849","k":"w","s":["Piranhas are South American fish. There are lots of scary stories about them. Most people think that piranhas are very "," creatures. However, a "," from St Andrews University, Anne Magurran, has recently announced that to call piranhas cruel killers is not fair. They "," eat fish, plants and insects. According to Professor Anne Magurran, piranhas attack people and animals only when they want to defend themselves. However, most travellers strongly "," with this point of view. They recommend keeping away from the water where piranhas live. When the fish attack in groups, it is practically "," to survive. Whatever your opinion of piranhas, this is a "," piece of advice one should follow."],"g":[{"w":"DANGER","a":["dangerous"],"t":"wa"},{"w":"SCIENCE","a":["scientist"],"t":"wn"},{"w":"USUAL","a":["usually"],"t":"wadv"},{"w":"AGREE","a":["disagree"],"t":"wpref"},{"w":"POSSIBLE","a":["impossible"],"t":"wpref"},{"w":"USE","a":["useful"],"t":"wa"}]},{"id":"52FDB7","k":"w","s":["Koalas are cute animals. ",", it causes them lots of problems. There are people who want to keep the cute exotic animal as a pet which may put the koala in a really "," situation. The problem is that the koala’s diet is very specific. To stay "," they should only eat eucalyptus leaves. The leaves need to be young and fresh, which means a person who keeps a koala should also have a lot of eucalyptus trees. Andrew Page, a "," who has been studying koalas for years, says that it’s a bad idea to keep this animal as a pet. According to him, people who try to do it usually have very little "," about koala’s lifestyle. And their ignorance can often cost the "," animal its life."],"g":[{"w":"FORTUNATELY","a":["unfortunately"],"t":"wpref"},{"w":"DANGER","a":["dangerous"],"t":"wa"},{"w":"HEALTH","a":["healthy"],"t":"wa"},{"w":"SCIENCE","a":["scientist"],"t":"wn"},{"w":"INFORM","a":["information"],"t":"wn"},{"w":"BEAUTY","a":["beautiful"],"t":"wa"}]},{"id":"B58C9C","k":"w","s":["In Moscow, there are approximately 35,000 dogs living on the streets. Some of these "," animals were born there. Others are just "," pets that have been abandoned by their owners. For many dogs the city may be a "," place to live in. However, scientists were surprised to find out how "," some animals can adapt to urban life. Some dogs have even learnt to use the city’s metro system! We still don't know how the dogs find out when to get off the train. One "," is that they use their excellent sense of smell to recognise the scents of their favourite destinations. Another idea is that they are able to remember the design of "," stations and find the station they need."],"g":[{"w":"HOME","a":["homeless"],"t":"wa"},{"w":"LUCKY","a":["unlucky"],"t":"wpref"},{"w":"DANGER","a":["dangerous"],"t":"wa"},{"w":"EASY","a":["easily"],"t":"wadv"},{"w":"SUGGEST","a":["suggestion"],"t":"wn"},{"w":"FAME","a":["famous"],"t":"wa"}]},{"id":"3FAAE8","k":"w","s":["Sam went to the giant aquarium near his house at least three times a week. He liked the fish and crabs, but the most "," creatures there were sharks. Sam could watch them for hours. He took photos through the glass and collected "," about them. It surprised him how fast a massive shark could be. Before the aquarium opened, Sam thought it was "," for sharks to be so quick and graceful. He knew that sharks were "," but they seldom attacked people. Many people, however, had hunted them and sharks had become endangered. ",", now there were laws protecting sharks. In the future, Sam wanted to be a "," and study sharks in the wild."],"g":[{"w":"WONDER","a":["wonderful"],"t":"wa"},{"w":"INFORM","a":["information"],"t":"wn"},{"w":"POSSIBLE","a":["impossible"],"t":"wpref"},{"w":"DANGER","a":["dangerous"],"t":"wa"},{"w":"FORTUNATE","a":["fortunately"],"t":"wadv"},{"w":"SCIENCE","a":["scientist"],"t":"wn"}]},{"id":"4C1BB2","k":"w","s":["'Surfers Against Sewage' (SAS) was founded in 1990 by water sports enthusiasts in the UK. They are an environmental "," that tries to protect the UK’s oceans and beaches. They say that it may be really "," to swim in the seas, and even sunbathe on the beaches because of the pollution. When SAS appeared, it informed people about the problem in quite an "," way. They went to public events with their surfboards and handed out leaflets. They "," attracted the attention of the media and people of Britain. They even managed to put pressure on the "," to forbid dumping waste in the sea, rivers and lakes. The campaign was indeed ",". Officials agreed to spend 8.5 billion pounds on cleaning up Britain’s seas and rivers."],"g":[{"w":"ORGANIZE","a":["organization","organisation"],"t":"wn"},{"w":"RISK","a":["risky"],"t":"wa"},{"w":"USUAL","a":["unusual"],"t":"wpref"},{"w":"QUICK","a":["quickly"],"t":"wadv"},{"w":"GOVERN","a":["government"],"t":"wn"},{"w":"SUCCESS","a":["successful"],"t":"wa"}]},{"id":"799112","k":"w","s":["What is the most eco-friendly transport? I believe it’s the bicycle. There are a lot of bicycles on the streets of our town and that is probably why it looks so green and ",". There are cycle lanes all over the town so using your bike to get to school or to the office is safe and convenient. ",", some people still prefer driving cars even for short distances. They make the environment less ",". As for me, I enjoy riding my bike very much and all my friends say that I’m a good ",". Next month I’m going to take part in a regional cycling "," and I hope to win it. I don't think I will stop riding my bicycle till I’m "," old."],"g":[{"w":"BEAUTY","a":["beautiful"],"t":"wa"},{"w":"FORTUNATELY","a":["unfortunately"],"t":"wpref"},{"w":"HEALTH","a":["healthy"],"t":"wa"},{"w":"RIDE","a":["rider"],"t":"wn"},{"w":"COMPETE","a":["competition"],"t":"wn"},{"w":"REAL","a":["really"],"t":"wadv"}]},{"id":"C63ECC","k":"w","s":["People in Britain often talk about climate and weather. They usually complain about their "," weather. However, there are parts of the world where extreme weather causes real dangers to the ",". Sandstorms, tornadoes and floods "," cause massive destruction. Lots of people become ",". To prevent this destruction, it’s important to forecast disasters in advance. Japan is the world "," in using new technology for this purpose. The Japanese have also worked out an "," system of informing people: phone companies automatically notify their customers about emergencies and disasters. These warnings are very efficient, and free of charge."],"g":[{"w":"CHANGE","a":["changeable","changing"],"t":"wa"},{"w":"POPULATE","a":["population"],"t":"wn"},{"w":"REGULAR","a":["regularly"],"t":"wadv"},{"w":"HOME","a":["homeless"],"t":"wa"},{"w":"LEAD","a":["leader"],"t":"wn"},{"w":"EFFECT","a":["effective"],"t":"wa"}]},{"id":"049D9C","k":"w","s":["Ecotourism is getting more and more popular. It offers two things at once: "," and entertainment. Most people agree that ecotourism is the most "," branch of tourism. It makes profit without destroying "," resources. When tourists choose eco trips, they stay in local houses with local people, not in "," hotels. They travel on foot, by boat, bicycle or elephant to avoid pollution. However, such trips are not at all cheap. This is "," the only disadvantage. But you can apply the principles of ecotourism every time you go on a normal holiday. You should remember that you're only a "," and be as careful as possible."],"g":[{"w":"EDUCATE","a":["education"],"t":"wn"},{"w":"HARM","a":["harmless"],"t":"wa"},{"w":"NATURE","a":["natural"],"t":"wa"},{"w":"EXPENSE","a":["expensive"],"t":"wa"},{"w":"PROBABLE","a":["probably"],"t":"wadv"},{"w":"VISIT","a":["visitor"],"t":"wn"}]},{"id":"2CC797","k":"w","s":["Russia is a large country with great diversity in flora and fauna. There are several large "," parks in Russia. A lot of different animals live there. Wolves are probably the best known, and are very well studied animals, so we have enough "," about their diet and behaviour. The wolf is a good ",". They usually hunt wild animals like deer and hares, but sometimes they can attack sheep, goats, and cows. The wolf tries to avoid people and only goes into villages when he is "," hungry. In some "," tales, the wolf is often represented as a clever animal that helps the main character, Ivan. The wolf is usually direct and "," and helps Ivan to cope with many difficult problems."],"g":[{"w":"NATION","a":["national"],"t":"wa"},{"w":"INFORM","a":["information"],"t":"wn"},{"w":"HUNT","a":["hunter"],"t":"wn"},{"w":"REAL","a":["really"],"t":"wadv"},{"w":"RUSSIA","a":["Russian"],"t":"wa"},{"w":"CREATE","a":["creative"],"t":"wa"}]},{"id":"65C0E4","k":"w","s":["The Turners were not used to snow. The most they ever got in Birmingham was an inch or so each winter. Even that happened quite ",". The "," thing was that a tiny bit of snow was enough to cancel school and even to close some businesses. One night, in March of 1993, something very "," happened. Very cold air from Canada created the ‘Storm of the Century’. When the Turner kids woke up on Saturday morning, there were 17 inches of "," snow as far as the eye could see. The Turners were in shock. They had no idea what to do. Though Mr. Turner was an experienced "," he chose to leave his car in the garage. He wanted the whole family to stay at home but it was natural for the kids to "," with him. They put on the warmest clothes they had and ran outside to enjoy the snow."],"g":[{"w":"RARE","a":["rarely"],"t":"wadv"},{"w":"FUN","a":["funny"],"t":"wa"},{"w":"EXCITE","a":["exciting"],"t":"wa"},{"w":"WONDER","a":["wonderful"],"t":"wa"},{"w":"DRIVE","a":["driver"],"t":"wn"},{"w":"AGREE","a":["disagree"],"t":"wpref"}]},{"id":"918CD5","k":"w","s":["Most graffiti street artists are anonymous. However, there are some artists who have become globally ",". Like the twin brothers from Brazil who call themselves Os Gemeos. They paint everything from small images to huge, "," pictures of people on buildings. Another celebrity among graffiti artists is Blek le Rat from Paris. He paints pictures of "," people. In this way he hopes to encourage residents to think "," about the problems of these people. Another well-known artist is Faith 47 from Cape Town. She paints big bright pictures of people and animals. The works of this "," can be found on pavements, empty factory buildings, and abandoned cars. It is "," to predict how street art will develop in the future but we can be sure that it is here to stay!"],"g":[{"w":"FAME","a":["famous"],"t":"wa"},{"w":"COLOUR","a":["colourful","colorful"],"t":"wa"},{"w":"HOME","a":["homeless"],"t":"wa"},{"w":"SERIOUS","a":["seriously"],"t":"wadv"},{"w":"PAINT","a":["painter"],"t":"wn"},{"w":"POSSIBLE","a":["impossible"],"t":"wpref"}]},{"id":"969DA9","k":"w","s":["Ballroom dancing in the UK is making a comeback. For the past five years its "," has grown thanks to the TV show 'Strictly Come Dancing'. In the show a professional ballroom "," has a celebrity for a partner. They learn different ballroom dances and perform them live on TV. Four judges and the public decide who stays in the "," and who leaves. The show demonstrates how glamorous ballroom dancing is. The celebrities wear "," dresses and suits and the show looks very ",". According to the ratings, the "," is becoming more and more popular with TV audiences."],"g":[{"w":"POPULAR","a":["popularity"],"t":"wn"},{"w":"DANCE","a":["dancer"],"t":"wn"},{"w":"COMPETE","a":["competition"],"t":"wn"},{"w":"COLOUR","a":["colourful","colorful"],"t":"wa"},{"w":"IMPRESS","a":["impressive"],"t":"wa"},{"w":"PERFORM","a":["performance"],"t":"wn"}]},{"id":"30E393","k":"w","s":["There is a popular opinion that all children are talented. It’s true - children are curious and have a good ",". It helps them make "," things from very routine objects like stones, leaves, or strips of fabric. Coloured paper, watercolours and pencils stimulate their "," minds a lot too! However, sometimes parents may "," of their children’s artistic activities like drawing on the walls and indoor experiments with fireworks. But "," is not a good solution! Any art activity develops children’s brains and stimulates their ability in science. Be "," with your children’s natural talents. Never stop them doing an activity but instead create an appropriate and safe environment for it."],"g":[{"w":"IMAGINE","a":["imagination"],"t":"wn"},{"w":"AMAZE","a":["amazing"],"t":"wa"},{"w":"CREATE","a":["creative"],"t":"wa"},{"w":"APPROVE","a":["disapprove"],"t":"wpref"},{"w":"PUNISH","a":["punishment"],"t":"wn"},{"w":"CARE","a":["careful"],"t":"wa"}]},{"id":"89AF9C","k":"w","s":["Early in her reign, Queen Victoria and her husband, Prince Albert, had a plan to hold a great world-wide exhibition of modern art and design. Sir Joseph Paxton, a botanist and landscape ",", won the competition to create the central exhibition hall. The "," he produced is still admired by architects today. Although at that time many thought it was "," to realize such a project. In 1851, Paxton constructed his Crystal Palace – an "," glass and iron pavilion, over a third of a mile long, with 800,000 square feet of floor space. The construction was an ultramodern iron frame with glass panels. The exhibition was very "," – it drew over six million visitors. ",", it was taken apart in 1854."],"g":[{"w":"DESIGN","a":["designer"],"t":"wn"},{"w":"BUILD","a":["building"],"t":"wn"},{"w":"POSSIBLE","a":["impossible"],"t":"wpref"},{"w":"AMAZE","a":["amazing"],"t":"wa"},{"w":"SUCCESS","a":["successful"],"t":"wa"},{"w":"UNFORTUNATE","a":["unfortunately"],"t":"wadv"}]},{"id":"957761","k":"w","s":["Learning languages is important nowadays. It is interesting and ",". Language skills help people to travel, study, and establish "," links with colleagues from other countries. Some people say that learning languages is easy but others strongly ",". They say that learning languages takes a lot of time and they are not happy with their progress anyway. Meanwhile, there are some strategies that can make you a successful language "," and save your time. The first idea is watching films in the original. If the films are ",", learning is just fun, not hard work. Online and live "," with people in the language you are learning also helps a lot."],"g":[{"w":"USE","a":["useful"],"t":"wa"},{"w":"PROFESSION","a":["professional"],"t":"wa"},{"w":"AGREE","a":["disagree"],"t":"wpref"},{"w":"LEARN","a":["learner"],"t":"wn"},{"w":"INTEREST","a":["interesting"],"t":"wa"},{"w":"COMMUNICATE","a":["communication"],"t":"wn"}]},{"id":"F7A3C2","k":"w","s":["Reading is one of the most popular pastimes and books are one of the main sources of knowledge. Everyone knows this but, ",", there are many young people who don’t like to read. They say it is not cool but I firmly "," with them. Books have the ability to take you to another world, to wake up your "," and transport you to places you’ve never been to. Books can be different in size and content. Their stories can be ",", scary, romantic or funny but above all, books are just ",". I'm absolutely sure that books by a good "," will always be popular."],"g":[{"w":"FORTUNATELY","a":["unfortunately"],"t":"wpref"},{"w":"AGREE","a":["disagree"],"t":"wpref"},{"w":"IMAGINE","a":["imagination"],"t":"wn"},{"w":"EXCITE","a":["exciting"],"t":"wa"},{"w":"INTEREST","a":["interesting"],"t":"wa"},{"w":"WRITE","a":["writer"],"t":"wn"}]},{"id":"E5FB65","k":"w","s":["Not everyone likes street art. "," nobody asks owners’ permission before drawing graffiti on their houses. Sometimes the drawings may be "," and nice but sometimes messy and ugly. What is graffiti – a form of art or vandalism? It depends on the drawing, I think. A friend of mine, John, is a street ",". He says that street art is a form of ",". A person can tell you nice or rude things, can’t he? As for John, he is a really nice and "," person. He enjoys drawing "," characters from animated films. When my neighbours saw his drawings, they asked him to paint some pictures on the wall of their house. Just to make it look brighter and more positive."],"g":[{"w":"USUAL","a":["usually"],"t":"wadv"},{"w":"INTEREST","a":["interesting"],"t":"wa"},{"w":"ART","a":["artist"],"t":"wn"},{"w":"COMMUNICATE","a":["communication"],"t":"wn"},{"w":"CREATE","a":["creative"],"t":"wa"},{"w":"VARY","a":["various"],"t":"wa"}]},{"id":"1801ED","k":"w","s":["Scientists have found that there is a direct "," between sunshine and our good mood. They noticed that people are kinder and more "," and easy-going when the sun is out. Sunlight "," improves negative moods and makes us feel less tired and more energetic. On the other hand, when it is hot people did not feel ",". On "," days people say they're less satisfied with their lives. But whatever the weather is, it’s important to spend enough time outdoors. Fresh air and sports can make any day feel ","!"],"g":[{"w":"CONNECT","a":["connection"],"t":"wn"},{"w":"HELP","a":["helpful"],"t":"wa"},{"w":"DEFINITE","a":["definitely"],"t":"wadv"},{"w":"COMFORT","a":["comfortable"],"t":"wa"},{"w":"RAIN","a":["rainy"],"t":"wa"},{"w":"AMAZE","a":["amazing"],"t":"wa"}]},{"id":"3C5219","k":"w","s":["It's not at all surprising that weather is a favourite topic for many people around the world. It affects where we choose to live, what we wear, our moods, and perhaps even our "," character. A "," day can blow away the deepest depression. And a gloomy rainy day can make you feel lonely and ",". ‘I’m feeling a bit under the weather’ is a common complaint in Britain, "," on Monday mornings. The weather can really be "," for moods and scientists have proved this fact. There is a "," between our mood and the weather we are having. But remember that good weather will have good effects on your mood only if you spend more than 30 minutes outdoors a day."],"g":[{"w":"NATION","a":["national"],"t":"wa"},{"w":"SUN","a":["sunny"],"t":"wa"},{"w":"HAPPY","a":["unhappy"],"t":"wpref"},{"w":"ESPECIAL","a":["especially"],"t":"wadv"},{"w":"RESPONSE","a":["responsible"],"t":"wa"},{"w":"CONNECT","a":["connection"],"t":"wn"}]},{"id":"94D353","k":"w","s":["There are lots of products that help us fight bad moods and depression. If you feel down and ",", just get a bar of dark chocolate from the fridge. Chocolate will improve your mood and you’ll feel "," and happy again. This "," is often used in chocolate adverts. Unfortunately, we can’t use this method too often. The positive effect does not last long. Meanwhile chocolate is not "," food. It contains fat and sugar which can make you overweight. Some people may also be allergic to chocolate and it can affect their ",", causing skin problems. The alternative and "," safe method to fight depression is doing sport. It can be recommended to everyone!"],"g":[{"w":"SLEEP","a":["sleepy"],"t":"wa"},{"w":"CHEER","a":["cheerful"],"t":"wa"},{"w":"INFORM","a":["information"],"t":"wn"},{"w":"HARM","a":["harmless"],"t":"wa"},{"w":"APPEAR","a":["appearance"],"t":"wn"},{"w":"ABSOLUTE","a":["absolutely"],"t":"wadv"}]},{"id":"FE9325","k":"w","s":["Shepherd’s pie started as an old English recipe. The pie gained "," in the Middle Ages. During the reign of Elizabeth I, mince meat pie became a must-have food, probably, because it was easy to cook, "," and tasty. Until the 16th century potatoes were "," known as pig food. But later they were accepted as a basic food in Europe. The Shepherd’s pie recipe changed to include potatoes as an ingredient. And the fame of this "," dish doubled. Now Shepherd’s pie is considered to be a "," British food but similar recipes can be found in other countries, although they may have different names. In Canada, for example, a "," in a restaurant would present it to tourists as Chinese pie."],"g":[{"w":"POPULAR","a":["popularity"],"t":"wn"},{"w":"HEALTH","a":["healthy"],"t":"wa"},{"w":"MAIN","a":["mainly"],"t":"wadv"},{"w":"TASTE","a":["tasty"],"t":"wn"},{"w":"TRADITION","a":["traditional"],"t":"wa"},{"w":"WAIT","a":["waiter"],"t":"wn"}]},{"id":"286CE3","k":"w","s":["I’m not a child but I still like cartoons and animated films. ",", I enrolled in an animation course in our university. The "," of the course explained to us how animated films are made. Basically, animation is just a series of pictures with a character. Each picture is a little different. When you show the pictures "," fast, it looks like they are moving. Some people say animation is not a serious thing. I strongly ",". Animated films may be "," but clever and useful to learn new skills. I believe they can be used in many spheres, and most importantly of all in ","."],"g":[{"w":"RECENT","a":["recently"],"t":"wadv"},{"w":"TEACH","a":["teacher"],"t":"wn"},{"w":"REAL","a":["really"],"t":"wadv"},{"w":"AGREE","a":["disagree"],"t":"wpref"},{"w":"FUN","a":["funny"],"t":"wa"},{"w":"EDUCATE","a":["education"],"t":"wn"}]},{"id":"117671","k":"w","s":["People are afraid of lots of "," things. There are many different kinds of fears called phobias. They affect at least a quarter of the ",". The "," treatment for people with strong phobias is some kind of therapy. In most cases it doesn’t work but doctors still believe that phobias can be cured. "," they have discovered a drug which can help people to overcome their phobias. It doesn’t work for everybody but when it does, it is very ",". People, who take the pill feel much better – most of their fears ","."],"g":[{"w":"USUAL","a":["unusual"],"t":"wpref"},{"w":"POPULATE","a":["population"],"t":"wn"},{"w":"TRADITION","a":["traditional"],"t":"wa"},{"w":"RECENT","a":["recently"],"t":"wadv"},{"w":"EFFECT","a":["effective"],"t":"wa"},{"w":"APPEAR","a":["disappear"],"t":"wpref"}]},{"id":"0271CA","k":"w","s":["British cuisine is simple. Puddings, stews, pies and breads are "," British dishes. Many of them are cooked and eaten on holidays. The choice of dishes has been influenced by the climate, history and "," position of the country. England is "," for its butter and cheese. The most popular of them is, of course, cheddar. Scotland is known for its "," meat dishes and cakes. Wales has a strong "," culture. As a result, Welsh cookery includes a lot of seafood, such as shrimps and crabs. However, nowadays most British restaurants offer food from different parts of the world. The choice depends only on your pocketbook and your ","."],"g":[{"w":"TRADITION","a":["traditional"],"t":"wa"},{"w":"GEOGRAPHY","a":["geographical","geographic"],"t":"wa"},{"w":"FAME","a":["famous"],"t":"wa"},{"w":"TASTE","a":["tasty"],"t":"wn"},{"w":"FISH","a":["fishing"],"t":"wa"},{"w":"IMAGINE","a":["imagination"],"t":"wn"}]},{"id":"514273","k":"w","s":["Dr Michael Werner says that he has eaten nothing for four years. The German "," explains that he gets all his energy from sunlight. He says he prefers only "," water and different fruit juices. Dr Werner has written an "," book about his experiences. In it he mentions that when he started the experiment he even put on weight. He says: \"I can't really give an "," of what’s happening to me; perhaps I just believe in my theory.\" Dr Werner’s colleagues say that only plants can produce energy from the sun, and they cannot explain how he is able to stay ",". “This case, ",", needs a lot more research before we will be able to explain it.” they say."],"g":[{"w":"SCIENCE","a":["scientist"],"t":"wn"},{"w":"DRINK","a":["drinking"],"t":"wa"},{"w":"EXCITE","a":["exciting"],"t":"wa"},{"w":"EXPLAIN","a":["explanation"],"t":"wn"},{"w":"HEALTH","a":["healthy"],"t":"wa"},{"w":"PROBABLE","a":["probably"],"t":"wadv"}]},{"id":"AB682E","k":"w","s":["In Andorra people live longer than in any other European country. It seems they have discovered the secret of a long and "," life. People in Andorra stay active and "," at old age. They attend gyms and public "," pools for free. Exercise is one reason; the others are clean air and a diet based on vegetables and olive oil. People of all ages in Andorra are cheerful and ",". They think that life is "," and they do their best to enjoy it. Andorra is the most "," country in Europe – they haven’t had a war for 700 years."],"g":[{"w":"AMAZE","a":["amazing"],"t":"wa"},{"w":"HEALTH","a":["healthy"],"t":"wa"},{"w":"SWIM","a":["swimming"],"t":"wa"},{"w":"FRIEND","a":["friendly"],"t":"wa"},{"w":"WONDER","a":["wonderful"],"t":"wa"},{"w":"PEACE","a":["peaceful"],"t":"wa"}]},{"id":"5117A5","k":"w","s":["There are pills for everything. If you can't sleep you take a pill. If you're depressed or just ",", you can also take a pill. These days scientists are developing a new pill that you can use for improving your ",". It will have the same effect on people’s bodies as doing sports. The scientific experiments on mice have given "," results. The animals got stronger and healthier without any exercise. However, some doctors think that such pills can be "," for health, especially in certain situations. The problem is that there will be people who may use the pill unwisely. For example, young girls who want to lose weight and get slim may take several pills at once. It will be very "," for their health. That’s why our government should think a lot before making the "," that allows the medicine to be produced."],"g":[{"w":"HAPPY","a":["unhappy"],"t":"wpref"},{"w":"FIT","a":["fitness"],"t":"wn"},{"w":"WONDER","a":["wonderful"],"t":"wa"},{"w":"DANGER","a":["dangerous"],"t":"wa"},{"w":"HARM","a":["harmful"],"t":"wa"},{"w":"DECIDE","a":["decision"],"t":"wn"}]},{"id":"3C6B1D","k":"w","s":["Kelly's family loved to watch football together. Sometimes they watched college games, but normally they watched "," teams play. This evening was special. Two teams were playing in the final match of the ",". Kelly's favourite team had actually got to the final this year, which "," happened. \"They're going to win for sure! It will be "," if they lose!\" Kelly thought. Watching the football game needed the presence of the whole family and lots of tasty food. So, Kelly's mum had made barbecue meatballs. Uncle Jolyon had brought a "," cheese sauce and chips. Aunt Katie brought some cakes. When the game started, everyone cheered. It seemed to Kelly that every "," of her team was doing their best to win-win- win! And they did!"],"g":[{"w":"PROFESSION","a":["professional"],"t":"wa"},{"w":"CHAMPION","a":["championship"],"t":"wn"},{"w":"RARE","a":["rarely"],"t":"wadv"},{"w":"FAIR","a":["unfair"],"t":"wpref"},{"w":"SPICE","a":["spicy"],"t":"wa"},{"w":"PLAY","a":["player"],"t":"wn"}]},{"id":"131022","k":"w","s":["Yoga is a very popular activity and lots of people practise it nowadays. There is an opinion, however, that to be "," in this activity you should start yoga in early childhood. This is not true! You can start yoga at any time in your life. What you really need is enthusiasm and a good "," – yogis often call them a guru. Yoga is not a ",". You can choose any pace that is "," for you. The aim is not to win but to make your body flexible and strong. It’s definitely "," to improve your body in a few days. It may take lots of time but it’s worth the time and effort. Yoga is an "," way to relax your mind. So it’s useful not only for your body."],"g":[{"w":"SUCCESS","a":["successful"],"t":"wa"},{"w":"TRAIN","a":["trainer"],"t":"wn"},{"w":"COMPETE","a":["competition"],"t":"wn"},{"w":"COMFORT","a":["comfortable"],"t":"wa"},{"w":"POSSIBLE","a":["impossible"],"t":"wpref"},{"w":"EFFECT","a":["effective"],"t":"wa"}]},{"id":"D10CD5","k":"w","s":["They say that pop music is created by and for young people. It often happens this way. A young "," makes one or two good records at the start of their career. Every year, lots of new stars become "," but for a short time. And just a year or two later they either "," or make less interesting records. It is difficult to find musicians who could make great records for a long time. Lots of popular groups from the 1970s, for example, are still better known for the songs they made in their "," past than for their more recent recordings. Some performers leave the stage but don't lose their ",". They continue to appear "," on TV as presenters, or in chat and reality shows."],"g":[{"w":"SING","a":["singer"],"t":"wn"},{"w":"FAME","a":["famous"],"t":"wa"},{"w":"APPEAR","a":["disappear"],"t":"wpref"},{"w":"SUCCESS","a":["successful"],"t":"wa"},{"w":"POPULAR","a":["popularity"],"t":"wn"},{"w":"REGULAR","a":["regularly"],"t":"wadv"}]},{"id":"9614AE","k":"w","s":["In 2005 the rock group The Rolling Stones released an album called ‘A Bigger Bang’. Many critics chose it as their favourite. This isn’t very ",", but just think, it's their 25th album, and the Rolling Stones have been on the stage for more than 40 years! The lead ",", Mick Jagger, the guitarist Keith Richards and the other musicians are over 60! And they are not losing their ",", even nowadays. However, they are still much more "," for the songs they made in the 1960s and 70s. But, you know what? Young people "," listen to the Rolling Stones with their fathers and granddads. Isn't that ","? In all aspects, theirs has been a remarkable career."],"g":[{"w":"SURPRISE","a":["surprising"],"t":"wa"},{"w":"SING","a":["singer"],"t":"wn"},{"w":"POPULAR","a":["popularity"],"t":"wn"},{"w":"FAME","a":["famous"],"t":"wa"},{"w":"REGULAR","a":["regularly"],"t":"wadv"},{"w":"IMPRESS","a":["impressive"],"t":"wa"}]},{"id":"8AF149","k":"w","s":["What do you think is the most stressful and "," job in Britain? Is it a police officer, a detective or a news ","? Well, statistics say it is a London taxi driver. It is a "," hard job as traffic is getting worse. If we sit in a traffic jam for a few minutes, we start feeling "," and irritated. But imagine you had to do that every day as your job! And you have to remain "," and attentive in spite of everything. London taxi drivers have to have a good memory to be able to take a "," from A to B without looking at the map or asking for directions."],"g":[{"w":"DANGER","a":["dangerous"],"t":"wa"},{"w":"REPORT","a":["reporter"],"t":"wn"},{"w":"REAL","a":["really"],"t":"wadv"},{"w":"NERVE","a":["nervous"],"t":"wa"},{"w":"CARE","a":["careful"],"t":"wa"},{"w":"TRAVEL","a":["traveller","traveler"],"t":"wn"}]},{"id":"187E74","k":"w","s":["Ratatouille is an American cartoon. The name of the cartoon comes from a "," French dish made of vegetables. The main character is a rat Remy, who is interested in cooking and dreams of becoming a "," chef. Remy is separated from his family at the "," of the movie. So, he finds himself in Paris, France. There his unusual "," with a poor boy begins. They both don’t care that most people hate rats and try to get rid of them. Remy wants to help the boy. He tries to teach him how to cook "," dishes. The story ends "," and the friends start a new restaurant."],"g":[{"w":"TRADITION","a":["traditional"],"t":"wa"},{"w":"SUCCES","a":["successful"],"t":"wa"},{"w":"BEGIN","a":["beginning"],"t":"wn"},{"w":"FRIEND","a":["friendship"],"t":"wn"},{"w":"TASTE","a":["tasty"],"t":"wn"},{"w":"HAPPY","a":["happily"],"t":"wadv"}]},{"id":"833091","k":"w","s":["How do people learn the news? About a century ago people got "," from newspapers since they were the only mass media that existed in those times. Radio and television seemed "," inventions as they broadcasted audio and visual images. The Internet has changed the situation dramatically. Now the audience has an opportunity to create the news, share their "," knowledge and express their opinions. The Internet supposes interaction, which makes it very "," to people. And what about the newspapers? Will they "," in the near future? I wish they wouldn’t as I like starting my day with a cup of coffee and a "," newspaper."],"g":[{"w":"INFORM","a":["information"],"t":"wn"},{"w":"WONDER","a":["wonderful"],"t":"wa"},{"w":"PERSON","a":["personal"],"t":"wa"},{"w":"ATTRACT","a":["attractive"],"t":"wa"},{"w":"APPEAR","a":["disappear"],"t":"wpref"},{"w":"TRADITION","a":["traditional"],"t":"wa"}]},{"id":"BA62B4","k":"w","s":["Learning languages is becoming a popular hobby with children and adults. It’s not only interesting but very ",", too. Foreign languages improve memory and develop ",". People who are able to speak two or more languages "," are usually more successful than their monolingual colleagues. They are better in making business and "," contacts. They are more "," and they are better in solving conflicts as they are able to accept new ideas and different points of view. Foreign languages make life more "," and colourful."],"g":[{"w":"USE","a":["useful"],"t":"wa"},{"w":"IMAGINE","a":["imagination"],"t":"wn"},{"w":"FLUENT","a":["fluently"],"t":"wadv"},{"w":"PERSON","a":["personal"],"t":"wa"},{"w":"CREATE","a":["creative"],"t":"wa"},{"w":"INTEREST","a":["interesting"],"t":"wa"}]},{"id":"D38AB6","k":"w","s":["It’s obvious that language skills are essential for everyone today. Foreign languages are very "," not only for travelling, but also for studying and building a career. There are lots of "," ways to learn a new language. However, everyone agrees that learning languages is "," without dictionaries. The main job of any dictionary is to explain what words mean. This can be done via "," or the unknown word can be explained in other words. It’s also good if the dictionary contains some examples of how the word is used – it helps to understand the "," much better. If you are a busy ",", you probably prefer online dictionaries to paper ones. Online dictionaries are very convenient to use if you have Internet access."],"g":[{"w":"USE","a":["useful"],"t":"wa"},{"w":"EFFECT","a":["effective"],"t":"wa"},{"w":"POSSIBLE","a":["impossible"],"t":"wpref"},{"w":"TRANSLATE","a":["translation"],"t":"wn"},{"w":"MEAN","a":["meaning"],"t":"wn"},{"w":"LEARN","a":["learner"],"t":"wn"}]},{"id":"0ED7CD","k":"w","s":["English is recognized as an "," language all over the world that’s why millions of people want to learn it. There are lots of different methods and the main problem is how to choose the best one. Some people believe that the most "," way is to study English in Britain or in any other English- speaking country. The advantage of going to Britain seems obvious. Everyone around you speaks English. It’s practically "," to avoid communication, so you’ll learn English ",". On the other hand, one can learn English at home. There are lots of possibilities there too: a good ",", a language school or an on-line course. There are many ways to get a good language "," now."],"g":[{"w":"NATIONAL","a":["international"],"t":"wpref"},{"w":"EFFECT","a":["effective"],"t":"wa"},{"w":"POSSIBLE","a":["impossible"],"t":"wpref"},{"w":"QUICK","a":["quickly"],"t":"wadv"},{"w":"TEACH","a":["teacher"],"t":"wn"},{"w":"EDUCATE","a":["education"],"t":"wn"}]},{"id":"F84969","k":"w","s":["Last year I decided to take an English course in Britain. When I called the language school, the "," explained to me everything about the school and the courses. They had an "," range of courses - for all levels and ages. As for the accommodation, there were two options: staying in a student hostel or living with a host family. Naturally enough, I wanted to choose the "," community of the hostel. "," my parents strongly disagreed with my choice, I had to stay with the host family. And I didn’t regret it! My host family was ",". They told me a lot about their country and were very curious about mine. We talked a lot and when I came back home, I could speak English ","!"],"g":[{"w":"MANAGE","a":["manager"],"t":"wn"},{"w":"IMPRESS","a":["impressive"],"t":"wa"},{"w":"NATIONAL","a":["international"],"t":"wpref"},{"w":"FORTUNATELY","a":["unfortunately"],"t":"wpref"},{"w":"WONDER","a":["wonderful"],"t":"wa"},{"w":"FLUENT","a":["fluently"],"t":"wadv"}]},{"id":"50183F","k":"w","s":["Last year I learnt Spanish in Barcelona. Spain is an "," country and I enjoyed my time there very much. My flatmates were two girls from Germany. They were nice but "," was a real problem for us because I didn’t speak German and they didn’t speak English, my first language. Sometimes we felt absolutely "," because we were not able to understand each other. However, it gave us additional motivation to learn Spanish! Very soon my teacher told me that I was speaking it ",". He was happy with my progress. My flatmates’ grades were "," too! It proved that practice is very important and if you want to speak a foreign language like a native ",", you should practise it a lot."],"g":[{"w":"AMAZE","a":["amazing"],"t":"wa"},{"w":"COMMUNICATE","a":["communication"],"t":"wn"},{"w":"HELP","a":["helpless"],"t":"wa"},{"w":"FLUENT","a":["fluently"],"t":"wadv"},{"w":"IMPRESS","a":["impressive"],"t":"wa"},{"w":"SPEAK","a":["speaker"],"t":"wn"}]},{"id":"04D997","k":"w","s":["Choosing a career is one of the most difficult choices we have to make in our lives. There are lots of interesting and "," professions, but which of them is the right choice for you? Researchers who work in "," and sociology asked people across the UK what their dream job would be. And the results were quite ",". According to the survey, people find modest jobs like charity work or gardening the most ",". Often at the top of their list are jobs such as a nurse or a ",". The study also shows that people in the UK are very "," and focus on the dream jobs they have a realistic chance of getting."],"g":[{"w":"EXCITE","a":["exciting"],"t":"wa"},{"w":"EDUCATE","a":["education"],"t":"wn"},{"w":"EXPECTED","a":["unexpected"],"t":"wpref"},{"w":"ATTRACT","a":["attractive"],"t":"wa"},{"w":"TEACH","a":["teacher"],"t":"wn"},{"w":"PRACTICE","a":["practical"],"t":"wa"}]},{"id":"8788FD","k":"w","s":["At school, writing essays was a real problem for me, and my grades were always low. "," enough, I didn’t like writing and tried to avoid writing lessons at all costs. I thought I didn’t have enough "," for any kind of writing. I only understood what my problem was after school. In a scientific journal I saw an article about children’s "," problems. The author claimed that anyone could become a good writer if they learned some rules. I read and reread the article several times. Then I tried to use the "," in practice. I have never become a professional journalist but from time to time I publish some pieces of my "," writing on my blog. My friends find these essays and stories very ","."],"g":[{"w":"NATURAL","a":["naturally"],"t":"wadv"},{"w":"IMAGINE","a":["imagination"],"t":"wn"},{"w":"WRITE","a":["writing"],"t":"wn"},{"w":"INFORM","a":["information"],"t":"wn"},{"w":"CREATE","a":["creative"],"t":"wa"},{"w":"ENJOY","a":["enjoyable"],"t":"wa"}]},{"id":"8E02AF","k":"w","s":["I’ve worked in an office for many years. It’s a very "," job and recently I’ve taken up a new hobby - gardening. My grandmother was a very good ",". She never did gardening as a job but for pleasure and ",". She had the so-called green fingers - the flowers and fruit trees she planted grew very ",". I wish I were as skillful as she was. It’s a pity my family does not share my interest. My children "," working outdoors. They prefer using the computer indoors. I don’t argue with them. Arguing and quarrelling makes me feel "," and unhappy but cannot change the situation. I hope one day they will join me in the garden."],"g":[{"w":"STRESS","a":["stressful"],"t":"wa"},{"w":"GARDEN","a":["gardener"],"t":"wn"},{"w":"ENTERTAIN","a":["entertainment"],"t":"wn"},{"w":"QUICK","a":["quickly"],"t":"wadv"},{"w":"LIKE","a":["dislike"],"t":"wpref"},{"w":"NERVE","a":["nervous"],"t":"wa"}]},{"id":"38E7EE","k":"w","s":["There is a belief that some jobs suit men better than women and some other jobs are more appropriate for women than for men. Nowadays, women more and more often take jobs that "," were done by men. A lot of women do "," and difficult jobs, becoming astronauts, pilots, and firefighters. No one is surprised when a girl wants to be a police officer or a train ",". In sports you can see a similar ",". Girls play football, ice hockey, go boxing and do other sports that seem to be "," for women. But the girls say that it is "," and they cannot see any reason why they should not go into the sport they like."],"g":[{"w":"TRADITIONAL","a":["traditionally"],"t":"wadv"},{"w":"DANGER","a":["dangerous"],"t":"wa"},{"w":"DRIVE","a":["driver"],"t":"wn"},{"w":"SITUATE","a":["situation"],"t":"wn"},{"w":"USUAL","a":["unusual"],"t":"wpref"},{"w":"EXCITE","a":["exciting"],"t":"wa"}]},{"id":"4B9B0D","k":"w","s":["My friend, Mary, is an extraordinary girl. She has always tried new things – new sports and new hobbies. She says life should be "," and it should change all the time. Now she has a new idea – she wants to be a firefighter. You may say that it is not a job for girls, but Mary will "," with this. In her opinion, putting out fires is a "," job but women are able to do it too. She has enrolled in a special training school where they learn skills and study firefighting ",". The teenagers also learn how to work as a team, which is a very "," skill wherever you work. And Mary is sure her team will be effective in any ","."],"g":[{"w":"INTEREST","a":["interesting"],"t":"wa"},{"w":"AGREE","a":["disagree"],"t":"wpref"},{"w":"DANGER","a":["dangerous"],"t":"wa"},{"w":"EQUIP","a":["equipment"],"t":"wn"},{"w":"USE","a":["useful"],"t":"wa"},{"w":"SITUATE","a":["situation"],"t":"wn"}]},{"id":"F4BF06","k":"w","s":["Lots of companies do business online. They sell goods and services, or provide "," to the general public. Doing business online is less "," and more convenient than running a traditional business, with offices and lots of employees. Surprisingly enough, there are lots of very young people among online businessmen. In spite of their age, they are quite "," and professional. For example, Ben Collins started his own online company when he was "," young. He was only 17. He says, “My business is "," – we work with people from different countries. In a real office, some people would "," that someone of my age could be a boss, but when I work online, nobody cares how old I am.”"],"g":[{"w":"INFORM","a":["information"],"t":"wn"},{"w":"EXPENSE","a":["expensive"],"t":"wa"},{"w":"SUCCESS","a":["successful"],"t":"wa"},{"w":"REAL","a":["really"],"t":"wadv"},{"w":"NATIONAL","a":["international"],"t":"wpref"},{"w":"AGREE","a":["disagree"],"t":"wpref"}]},{"id":"2D0D65","k":"w","s":["Have you heard of a Tadeus Bodnar? He is a "," Hungarian hairdresser. Not long ago he stopped using the "," scissors and comb. Now his instruments are axes, irons and vacuum cleaners. Now he is very "," and happy because with his innovative techniques he can express himself better. He cuts hair in his shop in Budapest by chopping it with an axe. Then he styles the hair using a vacuum cleaner, or straightens it with an iron. It’s difficult to believe but the extravagant hairdresser is very popular. Many people find him very ",". Every day there’s an "," line of people streaming to his shop. They wish to change their "," and have a thrilling, new experience."],"g":[{"w":"FAME","a":["famous"],"t":"wa"},{"w":"TRADITION","a":["traditional"],"t":"wa"},{"w":"SUCCES","a":["successful"],"t":"wa"},{"w":"CREATE","a":["creative"],"t":"wa"},{"w":"END","a":["endless"],"t":"wa"},{"w":"APPEAR","a":["appearance"],"t":"wn"}]},{"id":"0DF23E","k":"w","s":["Recently my neighbour Michael Wilkins got a job in sales. However, soon he found out that being a sales "," did not make him happy. He had to work long hours, and the job was "," and demanding. The atmosphere in the office was very "," and the workers often quarreled with each other. So, Michael decided to look for a more "," job. In the local newspaper, he saw an "," from a pizzeria. It was close to his house and they needed a waiter. Michael decided to apply and didn’t regret it. “It’s good to feed people. I enjoy seeing them smile – it’s important, isn’t it?” Michael says. Next week he’s going to take a cooking course. On completing it, he will be able to make "," pizzas himself!"],"g":[{"w":"MANAGE","a":["manager"],"t":"wn"},{"w":"STRESS","a":["stressful"],"t":"wa"},{"w":"FRIENDLY","a":["unfriendly"],"t":"wpref"},{"w":"ATTRACT","a":["attractive"],"t":"wa"},{"w":"ADVERTISE","a":["advertisement"],"t":"wn"},{"w":"TASTE","a":["tasty"],"t":"wn"}]},{"id":"CD1A4C","k":"w","s":["London is famous for its history and its sights. It is also a "," place for shopaholics. There are lots of different places to go. For example, you can go to Oxford Street. Sometimes it gets too crowded and ",", especially during the sales. If you don’t like it, go to Covent Garden. There you can have a "," cup of tea or a cappuccino in a quiet coffee house. You can also watch a street "," there. Portobello Road is the right place to go if you want to buy unique and "," things. Shopping in London is always an "," experience and it’s worth trying."],"g":[{"w":"WONDER","a":["wonderful"],"t":"wa"},{"w":"NOISE","a":["noisy"],"t":"wa"},{"w":"LOVE","a":["lovely"],"t":"wa"},{"w":"PERFORM","a":["performance"],"t":"wn"},{"w":"USUAL","a":["unusual"],"t":"wpref"},{"w":"EXCITE","a":["exciting"],"t":"wa"}]},{"id":"EBA080","k":"w","s":["I unexpectedly met my old friend Natalie at a metro station in Paris. I recognised her at once though we hadn’t seen each other for ten years. Now she works as a "," for Le Figaro newspaper. Our "," began when we were at school. After school, Natalie left Britain. French was her favourite subject and she went to university in Paris. Now she is a very "," journalist. Her life is busy and exciting. I was "," that she managed to find some time for me. Natalie made my visit to Paris ",". She took me to the most interesting places in the city. In the evening we even watched a performance at The Grand Opera House. It is one of the most "," opera houses in the world."],"g":[{"w":"REPORT","a":["reporter"],"t":"wn"},{"w":"FRIEND","a":["friendship"],"t":"wn"},{"w":"SUCCES","a":["successful"],"t":"wa"},{"w":"LUCK","a":["lucky"],"t":"wa"},{"w":"FORGETTABLE","a":["unforgettable"],"t":"wpref"},{"w":"FAME","a":["famous"],"t":"wa"}]},{"id":"C114F9","k":"w","s":["Olivia got a camera for her birthday. Her family was going on a trip to Washington D.C. and Olivia wanted to take pictures of the "," places she would see. The first place where they stopped was a sandy beach. Olivia took pictures of the ocean and the "," seagulls. The birds seemed to enjoy being photographed, but it was "," to go too close to them. Olivia had to take pictures from a distance. Next, the family moved on to the centre of Washington D.C. Olivia's heart was beating with ",". She got great shots of the White House, the Capitol and some other "," buildings. ",", it was time to head home. Olivia thought about how her friends would be surprised to see her pictures."],"g":[{"w":"WONDER","a":["wonderful"],"t":"wa"},{"w":"NOISE","a":["noisy"],"t":"wa"},{"w":"POSSIBLE","a":["impossible"],"t":"wpref"},{"w":"EXCITE","a":["excitement"],"t":"wn"},{"w":"FAME","a":["famous"],"t":"wa"},{"w":"FINAL","a":["finally"],"t":"wadv"}]},{"id":"A89E1C","k":"w","s":["I arrived in Liverpool in the afternoon. It was a "," day but the weather couldn’t spoil my excellent mood - I was in Liverpool! Many people associate this city with the "," musical band, the Beatles. It’s true, the Beatles are everywhere, but today it’s also "," to imagine Liverpool without its other great passion: football! The city is home to two teams: Liverpool and Everton. Everton is older and was more "," in the past, but since the 1990s it has been Liverpool’s time to shine. I’ve been Liverpool’s "," since I was a small boy. The team is based at the Anfield Stadium. I have watched games there twice. It was very "," and it was one of the most important memories of my childhood."],"g":[{"w":"RAIN","a":["rainy"],"t":"wa"},{"w":"FAME","a":["famous"],"t":"wa"},{"w":"POSSIBLE","a":["impossible"],"t":"wpref"},{"w":"SUCCESS","a":["successful"],"t":"wa"},{"w":"SUPPORT","a":["supporter"],"t":"wn"},{"w":"EXCITE","a":["exciting"],"t":"wa"}]},{"id":"5189D2","k":"w","s":["The city of St Davids is situated on the south-west coast of Wales. If you're looking for an "," place to go, this is your destination. It was granted city status by Queen Elizabeth II but in reality St Davids looks like an "," small village. It is actually the smallest city in Britain with a "," of just over 1,600. St Davids has a "," medieval cathedral which dates back to the 12th century. Today it is a "," place with narrow streets filled with cafes, hotels and art galleries – but only one pub! St Davids is famous for its sandy beaches and clear water. Whitesands Bay is a regular "," of the prestigious European Blue Flag award."],"g":[{"w":"USUAL","a":["unusual"],"t":"wpref"},{"w":"ATTRACT","a":["attractive"],"t":"wa"},{"w":"POPULATE","a":["population"],"t":"wn"},{"w":"BEAUTY","a":["beautiful"],"t":"wa"},{"w":"CHARM","a":["charming"],"t":"wa"},{"w":"WIN","a":["winner"],"t":"wn"}]},{"id":"5A7FD6","k":"w","s":["Many tourists don't like staying in city hotels. They prefer to avoid "," cities completely. They are attracted instead to dramatic views of mountains and "," valleys. If you like this sort of tourism, Mountain View Camp is for you. You’ll have an "," vacation there. The Camp has a view over the "," Hampson Valley. In the camp, tourists can rent either tents or bungalows. All the guests have free access to different facilities such as kitchens, bathrooms and playgrounds for children. The camp is a successful "," of both comfort and a green environment. The tourists can also have lunch in one of the many restaurants and try different "," cuisines."],"g":[{"w":"NOISE","a":["noisy"],"t":"wa"},{"w":"PEACE","a":["peaceful"],"t":"wa"},{"w":"FORGETTABLE","a":["unforgettable"],"t":"wpref"},{"w":"IMPRESS","a":["impressive"],"t":"wa"},{"w":"COMBINE","a":["combination"],"t":"wn"},{"w":"NATION","a":["national"],"t":"wa"}]},{"id":"AF61D5","k":"w","s":["Thousands of tourists visit Edinburgh every year. The capital of Scotland is "," for its history and architecture. It’s one of the "," centres of the country. The main "," of the city is Edinburgh Castle. It was built in the 12th century but it still looks magnificent and very ",". There are many historic monuments in Edinburgh. One of them is an unusual monument to Walter Scott, a well-known ",". The city streets are usually full of noisy tourists with cameras but if you want a quiet holiday, you can have it too - the beautiful and "," countryside is just round the corner."],"g":[{"w":"FAME","a":["famous"],"t":"wa"},{"w":"CULTURE","a":["cultural"],"t":"wa"},{"w":"ATTRACT","a":["attraction"],"t":"wn"},{"w":"IMPRESS","a":["impressive"],"t":"wa"},{"w":"WRITE","a":["writer"],"t":"wn"},{"w":"PEACE","a":["peaceful"],"t":"wa"}]},{"id":"4AF9A3","k":"w","s":["Dublin is the capital city of the Republic of Ireland. It has an "," airport. Dublin airport is large with flights from London and "," capitals. Dublin is a "," and cosmopolitan city. If you walk along its central streets, you will find a wide range of different shops, bars and restaurants. If you like sightseeing, you can visit the famous Dublin castle, one of the most "," buildings in the city. Dublin is a green city. It is such a pleasure to walk there on a hot "," day. In the evening you can listen to "," Irish music played in the streets and in the pubs."],"g":[{"w":"NATIONAL","a":["international"],"t":"wpref"},{"w":"EUROPE","a":["European"],"t":"wa"},{"w":"BEAUTY","a":["beautiful"],"t":"wa"},{"w":"IMPRESS","a":["impressive"],"t":"wa"},{"w":"SUN","a":["sunny"],"t":"wa"},{"w":"TRADITION","a":["traditional"],"t":"wa"}]},{"id":"500C53","k":"w","s":["Siem Reap is a small town in Cambodia, a country in southeast Asia. It is built around a "," cathedral. The town is charming with some fine examples of French colonial architecture. A legend says that a French "," once called the town “a pearl of Cambodia”. Nowadays, this town is quite popular with tourists. They often use it as a starting point for their "," travellings. The town is really remarkable. There you will find some "," stone monuments and statues, ancient buildings and picturesque ruins. Note that it’s "," hot there in the summer. Please ensure that you take "," walking shoes, light clothing and plenty of water to drink."],"g":[{"w":"FAME","a":["famous"],"t":"wa"},{"w":"WRITE","a":["writer"],"t":"wn"},{"w":"EXCITE","a":["exciting"],"t":"wa"},{"w":"IMPRESS","a":["impressive"],"t":"wa"},{"w":"USUAL","a":["unusually"],"t":"wpref"},{"w":"COMFORT","a":["comfortable"],"t":"wa"}]},{"id":"B68C95","k":"w","s":["The best thing about shopping in London is that there really are hundreds of cool shops selling "," clothes. Only here you can find a wide choice of "," and unique shops. Sometimes you can buy "," things there. You can spend a whole day in a shopping centre, have an "," lunchtime in one of the European or English restaurants, see a new film in the cinema and even enjoy a ",". But be "," – London shops are expensive! Don’t leave all your money in the shopping centre."],"g":[{"w":"FASHION","a":["fashionable"],"t":"wa"},{"w":"ORIGIN","a":["original"],"t":"wa"},{"w":"WONDER","a":["wonderful"],"t":"wa"},{"w":"AMAZE","a":["amazing"],"t":"wa"},{"w":"PERFORM","a":["performance"],"t":"wn"},{"w":"CARE","a":["careful"],"t":"wa"}]},{"id":"74C5E5","k":"w","s":["Last spring my best friend Isabelle and I booked a holiday in Venice. We rented a small apartment for a week with a "," view of the town. At the last moment another friend, Linda, asked if she could come with us. She was a ",", cheerful girl and we were glad to have her join us. Venice was a "," place and we enjoyed our trip greatly. Linda was fond of history and she told us lots of "," facts about the town. We also liked the Italian food very much. The waiter in the nearby pizzeria was a boy from Britain, so we never had any problems with ",". The only "," thing about Venice was the weather. It was unusually cold and windy that week."],"g":[{"w":"WONDER","a":["wonderful"],"t":"wa"},{"w":"FRIEND","a":["friendly"],"t":"wa"},{"w":"BEAUTY","a":["beautiful"],"t":"wa"},{"w":"INTEREST","a":["interesting"],"t":"wa"},{"w":"COMMUNICATE","a":["communication"],"t":"wn"},{"w":"PLEASANT","a":["unpleasant"],"t":"wpref"}]},{"id":"56568D","k":"w","s":["People spend hours talking on their mobile phones. There is an opinion that it may be "," to their health, but it is difficult to know for sure. Some research shows that mobile phones may cause brain problems. On the other hand, some doctors say mobiles are not "," at all. No matter what doctors say, it’s just "," to live without a mobile phone today. It has become a very "," device and people can’t do without it. It makes our life "," and saves time. People can get in touch with each other quickly. Mobile phones make "," easier."],"g":[{"w":"HARM","a":["harmful"],"t":"wa"},{"w":"DANGER","a":["dangerous"],"t":"wa"},{"w":"POSSIBLE","a":["impossible"],"t":"wpref"},{"w":"USE","a":["useful"],"t":"wa"},{"w":"COMFORT","a":["comfortable"],"t":"wa"},{"w":"COMMUNICATE","a":["communication"],"t":"wn"}]},{"id":"EC9D68","k":"w","s":["Last year my friend Mia and I went on holiday to Thailand. We stayed in a "," resort which is popular with tourists. We were very "," with the weather and we spent most of our days on the beach. The ocean was "," – the water was clear and warm. Thailand is a former French colony and that’s why French is very popular there. Mia was delighted with this fact because she learns French, she wants to be a "," of French, and she was able to practise the language there. She is also interested in architecture and she found some fine examples of the French colonial style in Thailand. It was an "," trip for me too. I am a photographer and I took lots of pictures of people and nature. Several magazines found my photos "," enough to publish. I feel very proud of that."],"g":[{"w":"FAME","a":["famous"],"t":"wa"},{"w":"LUCK","a":["lucky"],"t":"wa"},{"w":"WONDER","a":["wonderful"],"t":"wa"},{"w":"TEACH","a":["teacher"],"t":"wn"},{"w":"FORGETTABLE","a":["unforgettable"],"t":"wpref"},{"w":"INTEREST","a":["interesting"],"t":"wa"}]},{"id":"1A1CBD","k":"w","s":["It all started in 1865. A group of Frenchmen were having dinner in one of the most "," restaurants near Paris. They talked about the democratic changes in the USA and wanted to support the American people. After a short "," they agreed on an original idea. The idea was suggested by Frédéric-Auguste Bartholdi, a sculptor and ",". He said they could make a statue of a woman holding the torch of freedom. It was an ambitious project and it was "," to complete it quickly. It actually took 21 years for this idea to become a reality. The French people raised money to build the statue, and, ",", in 1886 it was ready. On July 4, 1886 the United States received their "," gift - the Statue of Liberty!"],"g":[{"w":"FASHION","a":["fashionable"],"t":"wa"},{"w":"DISCUSS","a":["discussion"],"t":"wn"},{"w":"DESIGN","a":["designer"],"t":"wn"},{"w":"POSSIBLE","a":["impossible"],"t":"wpref"},{"w":"FINAL","a":["finally"],"t":"wadv"},{"w":"AMAZE","a":["amazing"],"t":"wa"}]},{"id":"4F7C5B","k":"w","s":["Ireland is the country of myths and legends. Even the local people are not sure which of them were based on facts and which are the product of someone’s "," imagination. Leprechauns are "," the most famous characters from Irish mythology. They are depicted as old bearded men. Their "," is to guard the treasure of the fairies. Unfortunately, rainbows always point to the "," of the treasure and Leprechauns must rehide it. And there are plenty of rainbows in Ireland! Leprechauns are always busy. They are always very "," and try to be invisible to people. But if you manage to catch some "," Leprechaun, he must either give you his treasure or grant you three wishes."],"g":[{"w":"CREATE","a":["creative"],"t":"wa"},{"w":"PROBABLE","a":["probably"],"t":"wadv"},{"w":"RESPONSIBLE","a":["responsibility"],"t":"wn"},{"w":"LOCATE","a":["location"],"t":"wn"},{"w":"CARE","a":["careful"],"t":"wa"},{"w":"LUCKY","a":["unlucky"],"t":"wpref"}]},{"id":"21EBE2","k":"w","s":["If someone asks what your nationality is, how do you answer? For British people "," identity is a complex issue. Take me for example. I carry a passport issued by the British ",". I was born in England, but my Mum is Scottish and my Granny is from Northern Ireland. So, what am I? ",", I am all of them: English, Irish, Scottish and British. Each of the ‘nations’ has a lot in common but they also have their own unique culture and "," lifestyle. They "," it when people call them English. And perhaps the most important "," of all – each nation has its own football team!"],"g":[{"w":"NATION","a":["national"],"t":"wa"},{"w":"GOVERN","a":["government"],"t":"wn"},{"w":"ACTUAL","a":["actually"],"t":"wadv"},{"w":"TRADITION","a":["traditional"],"t":"wa"},{"w":"LIKE","a":["dislike"],"t":"wpref"},{"w":"DIFFER","a":["difference"],"t":"wn"}]},{"id":"20C8EA","k":"w","s":["St Patrick is the patron saint of Ireland. St Patrick is "," for his heroic deeds. People gladly believe in "," tales about St Patrick and don’t look for any historical evidence to prove them. And the facts often "," with the tales. For example, an old legend says that St Patrick drove all the snakes out of Ireland. This myth is actually untrue. At the time snakes appeared on the planet, Ireland was "," covered by water. Now it is an island which means it is surrounded by water. The water makes it "," for snakes to get to the island. The same "," is true for New Zealand, Greenland, and many other islands."],"g":[{"w":"FAME","a":["famous"],"t":"wa"},{"w":"AMAZE","a":["amazing"],"t":"wa"},{"w":"AGREE","a":["disagree"],"t":"wpref"},{"w":"COMPLETE","a":["completely"],"t":"wadv"},{"w":"POSSIBLE","a":["impossible"],"t":"wpref"},{"w":"SITUATE","a":["situation"],"t":"wn"}]},{"id":"E88433","k":"w","s":["Ray Kurzweil is a very popular figure in the field of science. He is a leading computer "," who has made lots of predictions about the future of humanity. So far he has written six books about artificial intelligence, and four of them have become "," best sellers in the USA. Ray strongly believes that soon computer intelligence will be a billion times more "," than the human brain. However, lots of experts don’t believe it and say that it is absolutely ",". Kurzweil disagrees with them and says that we are already a human-machine ci
